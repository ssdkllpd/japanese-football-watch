name: V2 Standings

on:
  workflow_dispatch:
    inputs:
      league:
        description: API-Football league ID
        required: true
        type: string
      season:
        description: API-Football season value
        required: true
        type: string

permissions:
  contents: read

jobs:
  ingest-standings:
    runs-on: ubuntu-latest
    env:
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      R2_BUCKET: ${{ vars.R2_BUCKET }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate required secrets and variables
        run: |
          test -n "$API_FOOTBALL_KEY" || { echo 'API_FOOTBALL_KEY secret is required'; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'CLOUDFLARE_API_TOKEN secret is required'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'CLOUDFLARE_ACCOUNT_ID secret is required'; exit 1; }
          test -n "$R2_BUCKET" || { echo 'R2_BUCKET repository variable is required'; exit 1; }

      - name: Fetch and normalize standings
        run: |
          node scripts/v2/fetch-standings.js \
            --league "${{ inputs.league }}" \
            --season "${{ inputs.season }}" \
            --out .tmp/v2/standings

      - name: Publish standings snapshot and latest object
        shell: bash
        run: |
          jq -c '.r2Objects[]' .tmp/v2/standings/manifest.json | while IFS= read -r item; do
            key=$(jq -r '.key' <<<"$item")
            file=$(jq -r '.file' <<<"$item")
            npx --yes wrangler@4 r2 object put "$R2_BUCKET/$key" \
              --file ".tmp/v2/standings/$file" --content-type application/json --remote
          done

      - name: Standings summary
        run: |
          jq '{competitionId, seasonId, groupCount, rowCount, quota}' .tmp/v2/standings/manifest.json

      - name: Upload normalized standings artifact
        uses: actions/upload-artifact@v4
        with:
          name: v2-standings-${{ inputs.league }}-${{ inputs.season }}
          path: .tmp/v2/standings
          if-no-files-found: error

  mirror-standings-to-d1:
    needs: ingest-standings
    runs-on: ubuntu-latest
    environment: d1-staging
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify exact reviewed staging target
        id: target
        env:
          D1_ADMIN_PUBLISH_ENABLED: ${{ vars.D1_ADMIN_PUBLISH_ENABLED }}
          ADMIN_WORKER_NAME: ${{ vars.ADMIN_WORKER_NAME }}
          D1_DATABASE_NAME: ${{ vars.D1_DATABASE_NAME }}
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          ADMIN_INGEST_URL: ${{ vars.ADMIN_INGEST_URL }}
        run: |
          if [ "$D1_ADMIN_PUBLISH_ENABLED" != 'true' ]; then
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          node scripts/d1/verify-d1-target.mjs --manifest config/d1-targets.json --target staging
          echo 'enabled=true' >> "$GITHUB_OUTPUT"
          echo "ADMIN_INGEST_URL=$ADMIN_INGEST_URL" >> "$GITHUB_ENV"

      - name: Download normalized standings artifact
        if: steps.target.outputs.enabled == 'true'
        uses: actions/download-artifact@v4
        with:
          name: v2-standings-${{ inputs.league }}-${{ inputs.season }}
          path: .tmp/v2/standings

      - name: Mirror standings through protected admin ingest
        if: steps.target.outputs.enabled == 'true'
        shell: bash
        env:
          ADMIN_INGEST_TOKEN: ${{ secrets.ADMIN_INGEST_TOKEN }}
        run: |
          test -n "$ADMIN_INGEST_URL" || { echo 'ADMIN_INGEST_URL is required'; exit 1; }
          test -n "$ADMIN_INGEST_TOKEN" || { echo 'ADMIN_INGEST_TOKEN is required'; exit 1; }
          jq '{
            schemaVersion: "jfw-d1-admin-ingest-plan/1",
            fixtures: [],
            standings: [{competitionId, seasonId}],
            dateIndexCoverages: [],
            expectedTotals: null
          }' .tmp/v2/standings/manifest.json > .tmp/v2/standings/d1-admin-plan.json
          node scripts/d1/request-admin-ingest.mjs \
            --url "$ADMIN_INGEST_URL" \
            --plan .tmp/v2/standings/d1-admin-plan.json \
            --report .tmp/v2/standings/d1-admin-report.json

      - name: Upload D1 mirror evidence
        if: always() && steps.target.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: d1-standings-${{ inputs.league }}-${{ inputs.season }}-${{ github.sha }}
          path: .tmp/v2/standings/d1-admin-*.json
          if-no-files-found: error
