name: Refresh Today 2026-10-15

on:
  push:
    branches: [ops/schedule-rollout-verification-20261015]
    paths:
      - .github/workflows/today-refresh-20261015.yml

permissions:
  contents: read
  actions: write

jobs:
  execute-schedule:
    concurrency:
      group: d1-staging-write
      queue: max
      cancel-in-progress: false
    runs-on: ubuntu-latest
    environment: d1-staging
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ADMIN_INGEST_TOKEN: ${{ secrets.ADMIN_INGEST_TOKEN }}
      PUBLIC_DATE_AUDIT_TOKEN: ${{ secrets.PUBLIC_DATE_AUDIT_TOKEN }}
      ADMIN_INGEST_URL: ${{ vars.ADMIN_INGEST_URL }}
      ADMIN_WORKER_NAME: ${{ vars.ADMIN_WORKER_NAME }}
      D1_DATABASE_NAME: ${{ vars.D1_DATABASE_NAME }}
      D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
      R2_BUCKET: ${{ vars.R2_BUCKET }}
      D1_ADMIN_PUBLISH_ENABLED: ${{ vars.D1_ADMIN_PUBLISH_ENABLED }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download the inspected preview from the exact run
        uses: actions/download-artifact@v4
        with:
          name: schedule-rollout-preview-38686290885
          run-id: 38686290885
          github-token: ${{ github.token }}
          path: .tmp/inspected-preview
      - name: Recheck unchanged baseline and pin all thirty inspected changes
        id: prepare
        shell: bash
        run: |
          set -euo pipefail
          test "$D1_ADMIN_PUBLISH_ENABLED" = true
          test "${#PUBLIC_DATE_AUDIT_TOKEN}" -ge 32
          node scripts/d1/verify-d1-target.mjs --manifest config/d1-targets.json --target staging
          mkdir -p .tmp/limited-verification
          node scripts/d1/check-paid-backfill-capacity.mjs --out .tmp/limited-verification/usage.json
          node scripts/d1/render-admin-wrangler.mjs --output .tmp/limited-verification/wrangler.toml
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { createHash } from 'node:crypto';
          import { execFileSync } from 'node:child_process';
          import { adminScheduleSender } from './scripts/d1/execute-fixture-schedule-plan.mjs';
          import { SCHEDULE_INVENTORY_SQL, d1AuditRows } from './scripts/d1/capture-schedule-audit.mjs';
          const root='.tmp/limited-verification';
          const raw=fs.readFileSync('.tmp/inspected-preview/plan.json');
          const beforeRaw=fs.readFileSync('.tmp/inspected-preview/inventory.json');
          const sha=b=>createHash('sha256').update(b).digest('hex');
          if(sha(raw)!=='c5622bf881592c14e0fed5d04eb3f5a0d5f1ff30d64090fb14eb3c1aea0f32a3'
            || sha(beforeRaw)!=='535e8bdb29670f59d011f169e347b49cdb02dce22281b8d566578e522dcfc4e0') throw new Error('Inspected preview bytes differ.');
          const plan=JSON.parse(raw);
          const age=Date.now()-Date.parse(plan.generatedAt);
          if(!Number.isFinite(age) || age<0 || age>30*60000) throw new Error('Preview is outside its 30-minute execution window.');
          const ids=plan.changes.map(item=>item.fixtureId);
          if(ids.length!==30 || new Set(ids).size!==30) throw new Error('Expected exactly 30 inspected changes.');
          const selected=ids.map(id=>{
            const matches=plan.changes.filter(item=>item.fixtureId===id);
            if(matches.length!==1) throw new Error('Pinned fixture is not a unique preview change.');
            return matches[0];
          });
          const day=utc=>new Date(Date.parse(utc)+9*3600000).toISOString().slice(0,10);
          if(plan.schemaVersion!=='jfw-fixture-schedule-plan/1' || plan.executable!==true
            || selected.filter(item=>day(item.oldKickoffUtc)!==day(item.newKickoffUtc)).length!==21
            || selected.some(item=>item.operation!=='fixture_schedule_update' || item.oldStatus!=='NS'
              || !['NS','ABD'].includes(item.newStatus))) throw new Error('Limited selection is unsafe.');
          const query=(name,sql)=>{
            const raw=execFileSync('npx',['--yes','wrangler@4','d1','execute',process.env.D1_DATABASE_NAME,
              '--remote','--json','--config',`${root}/wrangler.toml`,'--command',sql],
              {encoding:'utf8',timeout:120000,maxBuffer:16*1024*1024});
            fs.writeFileSync(`${root}/${name}.json`,raw);
            return d1AuditRows(JSON.parse(raw));
          };
          const current=query('before',SCHEDULE_INVENTORY_SQL);
          if(JSON.stringify(current)!==JSON.stringify(d1AuditRows(JSON.parse(beforeRaw)))) throw new Error('Stored baseline changed after preview.');
          const pending=query('pending-before','SELECT fixture_id,old_date_jst,new_date_jst FROM fixture_schedule_refresh_pending ORDER BY fixture_id');
          const status=await adminScheduleSender(process.env)({schemaVersion:'jfw-d1-admin-ingest/1',operation:'fixture_schedule_repair_status'});
          fs.writeFileSync(`${root}/repair-status-before.json`,JSON.stringify(status,null,2)+'\n');
          if(status.remaining!==0 || !Array.isArray(status.dates) || status.dates.length || pending.length) throw new Error('Initial repairs require investigation before limited writes.');
          const limited={...plan,changes:selected,batchSize:30,remainingAfterBatch:0};
          fs.writeFileSync(`${root}/plan.json`,JSON.stringify(limited,null,2)+'\n');
          fs.writeFileSync(`${root}/selection-report.json`,JSON.stringify({previewRun:38686290885,
            planSha256:sha(raw),selectedIds:ids,crossings:21,preservedFixtures:current.length-30,providerRequests:0},null,2)+'\n');
          console.log(JSON.stringify({selected,baselineFixtures:current.length,initialRepairs:0,providerRequests:0}));
          NODE
      - name: Apply all thirty inspected schedule changes
        id: execute
        run: node scripts/d1/execute-fixture-schedule-plan.mjs execute .tmp/limited-verification/plan.json --all > .tmp/limited-verification/execution-report.json
      - name: Confirm affected repairs are fully drained
        if: always() && steps.execute.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { adminScheduleSender } from './scripts/d1/execute-fixture-schedule-plan.mjs';
          import { drainDateRepairs } from './scripts/d1/drain-date-repairs.mjs';
          const root='.tmp/limited-verification';
          const plan=JSON.parse(fs.readFileSync(`${root}/plan.json`));
          const day=utc=>new Date(Date.parse(utc)+9*3600000).toISOString().slice(0,10);
          const dates=[...new Set(plan.changes.flatMap(item=>[day(item.oldKickoffUtc),day(item.newKickoffUtc)]))];
          const report=await drainDateRepairs(adminScheduleSender(process.env),{dates});
          fs.writeFileSync(`${root}/repair-report.json`,JSON.stringify(report,null,2)+'\n');
          console.log(JSON.stringify(report));
          if(!report.passed) throw new Error('Limited repair check failed.');
          NODE
      - name: Independently compare all fixtures and affected D1 R2 fresh scopes
        if: always() && steps.execute.outcome != 'skipped' && steps.prepare.outcome == 'success'
        run: node scripts/d1/capture-schedule-audit.mjs .tmp/limited-verification/plan.json .tmp/limited-verification/before.json .tmp/limited-verification/audit
      - name: Upload complete bounded verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: today-schedule-${{ github.run_id }}
          path: .tmp/limited-verification/**/*.json
          retention-days: 14
          if-no-files-found: warn

  result-batch-1:
    needs: execute-schedule
    uses: ./.github/workflows/api-football-manual-backfill.yml
    with:
      mode: execute
      confirmation: RUN API-FOOTBALL BACKFILL
      auto_continue: ${{ 'false' }}
      batches_left: '6'
      billing_mode: paid
    secrets: inherit

  result-batch-2:
    needs: result-batch-1
    uses: ./.github/workflows/api-football-manual-backfill.yml
    with:
      mode: execute
      confirmation: RUN API-FOOTBALL BACKFILL
      auto_continue: ${{ 'false' }}
      batches_left: '5'
      billing_mode: paid
    secrets: inherit

  result-batch-3:
    needs: result-batch-2
    uses: ./.github/workflows/api-football-manual-backfill.yml
    with:
      mode: execute
      confirmation: RUN API-FOOTBALL BACKFILL
      auto_continue: ${{ 'false' }}
      batches_left: '4'
      billing_mode: paid
    secrets: inherit

  result-batch-4:
    needs: result-batch-3
    uses: ./.github/workflows/api-football-manual-backfill.yml
    with:
      mode: execute
      confirmation: RUN API-FOOTBALL BACKFILL
      auto_continue: ${{ 'false' }}
      batches_left: '3'
      billing_mode: paid
    secrets: inherit

  result-batch-5:
    needs: result-batch-4
    uses: ./.github/workflows/api-football-manual-backfill.yml
    with:
      mode: execute
      confirmation: RUN API-FOOTBALL BACKFILL
      auto_continue: ${{ 'false' }}
      batches_left: '2'
      billing_mode: paid
    secrets: inherit

  result-final-batch:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    environment: d1-staging
    env:
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      R2_BUCKET: ${{ vars.R2_BUCKET }}
      ADMIN_INGEST_URL: ${{ vars.ADMIN_INGEST_URL }}
      ADMIN_INGEST_TOKEN: ${{ secrets.ADMIN_INGEST_TOKEN }}
      D1_ADMIN_PUBLISH_ENABLED: ${{ vars.D1_ADMIN_PUBLISH_ENABLED }}
      ADMIN_WORKER_NAME: ${{ vars.ADMIN_WORKER_NAME }}
      D1_DATABASE_NAME: ${{ vars.D1_DATABASE_NAME }}
      D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
      BACKFILL_CHECKPOINT_KEY: automation/api-football/manual-backfill-checkpoint-v1.json
      API_FOOTBALL_MIN_INTERVAL_MS: '300'
      API_FOOTBALL_DAILY_RESERVE: '100'
      JFW_MANUAL_DETAIL_DAILY_CAP: 120
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Verify manual gate and exact staging target
      shell: bash
      env:
        REQUESTED_MODE: execute
        CONFIRMATION: RUN API-FOOTBALL BACKFILL
        BATCHES_LEFT: 1
        BILLING_MODE: paid
      run: |
        set -euo pipefail
        test "$REQUESTED_MODE" = preview || test "$REQUESTED_MODE" = execute
        [[ "$BATCHES_LEFT" =~ ^([1-9]|1[0-2])$ ]]
        test "$BILLING_MODE" = free || test "$BILLING_MODE" = paid
        if [ "$REQUESTED_MODE" = execute ]; then
          test "$CONFIRMATION" = 'RUN API-FOOTBALL BACKFILL'
          test "$D1_ADMIN_PUBLISH_ENABLED" = true
        fi
        test -n "$API_FOOTBALL_KEY" && test -n "$CLOUDFLARE_API_TOKEN"
        test -n "$CLOUDFLARE_ACCOUNT_ID" && test -n "$ADMIN_INGEST_TOKEN"
        test -n "$ADMIN_INGEST_URL" && test -n "$R2_BUCKET"
        node scripts/d1/verify-d1-target.mjs --manifest config/d1-targets.json --target staging
        node -e "require('./scripts/v2/api-football-automation-plan').validatePolicy(require('./config/api-football-automation.json'))"
    - name: Guard Paid D1 monthly usage before any staging write
      run: node scripts/d1/check-paid-backfill-capacity.mjs --out .tmp/manual-backfill/paid-usage-start.json
    - name: Read published fixture IDs and current publication budget
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p .tmp/manual-backfill
        node scripts/d1/render-admin-wrangler.mjs --output .tmp/manual-backfill/wrangler.toml
        scopes="'af:season:39:2026','af:season:40:2026','af:season:61:2026','af:season:78:2026','af:season:88:2026','af:season:94:2026','af:season:135:2026','af:season:140:2026','af:season:144:2026','af:season:179:2026'"
        npx --yes wrangler@4 d1 execute "$D1_DATABASE_NAME" --remote --json \
          --config .tmp/manual-backfill/wrangler.toml \
          --command "SELECT fixture.canonical_id, COUNT(*) OVER () AS total FROM fixtures fixture JOIN competition_seasons season ON season.id=fixture.competition_season_id JOIN fixture_revisions revision ON revision.id=fixture.published_revision AND revision.fixture_id=fixture.id WHERE season.canonical_id IN ($scopes) AND revision.lifecycle_state='published' ORDER BY fixture.canonical_id" \
          > .tmp/manual-backfill/published.json
        npx --yes wrangler@4 d1 execute "$D1_DATABASE_NAME" --remote --json \
          --config .tmp/manual-backfill/wrangler.toml \
          --command "SELECT fixture.canonical_id, fixture.date_jst, COUNT(*) OVER () AS total FROM fixtures fixture JOIN competition_seasons season ON season.id=fixture.competition_season_id WHERE season.canonical_id IN ($scopes) ORDER BY fixture.canonical_id" \
          > .tmp/manual-backfill/stored-dates.json
        node scripts/d1/read-api-football-automation-budget.mjs \
          --out .tmp/manual-backfill/budget.json
    - name: Load prior batch recovery checkpoint
      shell: bash
      run: |
        set -euo pipefail
        checkpoint=.tmp/manual-backfill/prior-checkpoint.json
        get_log=.tmp/manual-backfill/prior-checkpoint-get.log
        if ! npx --yes wrangler@4 r2 object get "$R2_BUCKET/$BACKFILL_CHECKPOINT_KEY" \
          --file "$checkpoint" --remote >"$get_log" 2>&1; then
          if grep -Eqi 'not found|does not exist|404' "$get_log"; then
            printf '%s\n' '{"schemaVersion":"jfw-manual-backfill-checkpoint/1","status":"complete","fixtures":[]}' > "$checkpoint"
          else
            cat "$get_log" >&2
            exit 1
          fi
        fi
        test -s "$checkpoint"
        node scripts/v2/manual-backfill-checkpoint.js recover \
          "$checkpoint" .tmp/manual-backfill/published.json \
          .tmp/manual-backfill/recovery-dates.json
    - name: Repair date indexes for a previous partial publication
      shell: bash
      run: |
        set -euo pipefail
        node scripts/d1/repair-manual-backfill-dates.mjs \
          .tmp/manual-backfill/recovery-dates.json
        jq '.status = "complete"' .tmp/manual-backfill/prior-checkpoint.json \
          > .tmp/manual-backfill/recovered-checkpoint.json
        if [ "$(jq -r '.status' .tmp/manual-backfill/prior-checkpoint.json)" = pending ]; then
          npx --yes wrangler@4 r2 object put "$R2_BUCKET/$BACKFILL_CHECKPOINT_KEY" \
            --file .tmp/manual-backfill/recovered-checkpoint.json \
            --content-type application/json --remote
        fi
    - name: Discover all ten seasons and plan unpublished final fixtures
      id: plan
      shell: bash
      run: |
        set -euo pipefail
        node scripts/v2/plan-manual-fixture-backfill.js \
          --policy config/api-football-automation.json \
          --inventory .tmp/manual-backfill/published.json \
          --stored-dates .tmp/manual-backfill/stored-dates.json \
          --budget .tmp/manual-backfill/budget.json \
          --out .tmp/manual-backfill/plan.json \
          --preview "false"
        echo "action_count=$(jq '(.detailFetches | length) + (.standingsFetches | length)' .tmp/manual-backfill/plan.json)" >> "$GITHUB_OUTPUT"
        echo "fixture_count=$(jq '.detailFetches | length' .tmp/manual-backfill/plan.json)" >> "$GITHUB_OUTPUT"
        echo "daily_remaining=$(jq -r '.quota.dailyRemaining' .tmp/manual-backfill/plan.json)" >> "$GITHUB_OUTPUT"
    - name: Reconcile the explicitly held published fixture 1552141 through the rich detail path
      shell: bash
      run: |
        set -euo pipefail
        node --input-type=module <<'NODE'
        import fs from 'node:fs';
        import { createRequire } from 'node:module';
        const require=createRequire(import.meta.url);
        const { createClientFromEnv }=require('./scripts/api-football/client');
        const { canonicalFixture,dateJst }=require('./scripts/v2/api-football-automation-plan');
        const path='.tmp/manual-backfill/plan.json';
        const plan=JSON.parse(fs.readFileSync(path));
        if(plan.detailFetches.length>=20 || plan.detailFetches.some(x=>x.fixtureId==='af:fixture:1552141')) throw new Error('No slot for the explicit reconciliation.');
        const budget=JSON.parse(fs.readFileSync('.tmp/manual-backfill/budget.json'));
        if(budget.fixtureIds.includes('af:fixture:1552141') || budget.fixtureIds.length+plan.detailFetches.length+1>120) throw new Error('Protected fixture exceeds the existing daily cap.');
        const client=createClientFromEnv(process.env);
        await client.refreshDailyQuota();
        const result=await client.get('fixtures',{id:1552141});
        if(result.data.response.length!==1) throw new Error('Protected provider identity is ambiguous.');
        const fixture=canonicalFixture(result.data.response[0]);
        if(fixture?.fixtureId!=='af:fixture:1552141' || fixture.league!==88 || fixture.season!==2026 || !['FT','AET','PEN'].includes(fixture.status)) throw new Error('Protected fixture is not the expected finalized identity.');
        const rows=JSON.parse(fs.readFileSync('.tmp/manual-backfill/stored-dates.json'))[0].results;
        const previous=rows.find(x=>x.canonical_id===fixture.fixtureId);
        if(!previous) throw new Error('Protected stored fixture is absent.');
        plan.detailFetches.push({...fixture,recheckStage:'initial',dueAt:new Date().toISOString(),...(previous.date_jst!==dateJst(fixture.kickoffUtc)?{previousDateJst:previous.date_jst}:{})});
        plan.explicitReconciliations=[fixture.fixtureId];
        plan.quota.dailyRemaining=client.lastQuota.dailyRemaining;
        plan.quota.estimatedProviderRequests+=6;
        if(plan.quota.estimatedProviderRequests>150) throw new Error('Bounded provider request cap exceeded.');
        fs.writeFileSync(path,JSON.stringify(plan,null,2)+'\n');
        console.log(JSON.stringify({explicitReconciliation:fixture,previousDateJst:previous.date_jst,totalDetails:plan.detailFetches.length}));
        NODE
    - name: Fetch and validate the selected fixture details and standings
      if: steps.plan.outputs.action_count != '0'
      env:
        API_FOOTBALL_INITIAL_DAILY_REMAINING: ${{ steps.plan.outputs.daily_remaining }}
      run: |
        node scripts/v2/execute-api-football-automation-fetches.js \
          --plan .tmp/manual-backfill/plan.json \
          --out .tmp/manual-backfill/artifacts
    - name: Validate the exact Admin Worker publication plan
      if: steps.plan.outputs.action_count != '0'
      run: |
        node scripts/d1/create-api-football-automation-admin-plan.js \
          --plan .tmp/manual-backfill/plan.json \
          --artifacts .tmp/manual-backfill/artifacts \
          --output .tmp/manual-backfill/d1/admin-plan.json
    - name: Verify publication budget again before R2 writes
      if: true && steps.plan.outputs.action_count != '0'
      shell: bash
      run: |
        set -euo pipefail
        node scripts/d1/read-api-football-automation-budget.mjs \
          --out .tmp/manual-backfill/current-budget.json
        node scripts/v2/check-manual-backfill-budget.js \
          .tmp/manual-backfill/budget.json \
          .tmp/manual-backfill/current-budget.json \
          .tmp/manual-backfill/plan.json
    - name: Recheck Paid D1 monthly usage before publication
      if: true && true && steps.plan.outputs.action_count != '0'
      run: node scripts/d1/check-paid-backfill-capacity.mjs --out .tmp/manual-backfill/paid-usage-current.json
    - name: Retain the current protected fixture bundle before reconciliation
      run: npx --yes wrangler@4 r2 object get "$R2_BUCKET/football/v2/competitions/af:competition:88/seasons/af:season:88:2026/fixtures/af:fixture:1552141.json"
        --file .tmp/manual-backfill/protected-fixture-before.json --remote
    - name: Check every fixture guard before R2 writes
      if: true && steps.plan.outputs.fixture_count != '0'
      shell: bash
      run: |
        set -euo pipefail
        while IFS= read -r provider_id; do
          dir=".tmp/manual-backfill/artifacts/fixtures/$provider_id"
          fixture_id=$(jq -r '.fixtureId' "$dir/manifest.json")
          competition_id=$(jq -r '.fixture.competitionId' "$dir/fixture.json")
          season_id=$(jq -r '.fixture.seasonId' "$dir/fixture.json")
          fixture_date=$(jq -r '.fixture.dateJst' "$dir/fixture.json")
          previous_date=$(jq -r --arg id "$fixture_id" \
            '.detailFetches[] | select(.fixtureId==$id) | .previousDateJst // empty' \
            .tmp/manual-backfill/plan.json)
          node scripts/d1/check-automation-fixture-corrections.mjs \
            "$fixture_id" "$competition_id" "$season_id" "$fixture_date" "$previous_date" \
            > "$dir/guard-report.json"
        done < <(jq -r '.detailFetches[].providerFixtureId' .tmp/manual-backfill/plan.json)
    - name: Checkpoint this batch before any fixture or index write
      if: true && steps.plan.outputs.fixture_count != '0'
      shell: bash
      run: |
        set -euo pipefail
        node scripts/v2/manual-backfill-checkpoint.js create \
          .tmp/manual-backfill/plan.json .tmp/manual-backfill/artifacts \
          .tmp/manual-backfill/checkpoint.json
        npx --yes wrangler@4 r2 object put "$R2_BUCKET/$BACKFILL_CHECKPOINT_KEY" \
          --file .tmp/manual-backfill/checkpoint.json \
          --content-type application/json --remote
    - name: Reconcile and publish selected fixture bundles to R2
      if: true && steps.plan.outputs.action_count != '0'
      shell: bash
      run: |
        set -euo pipefail
        while IFS= read -r provider_id; do
          dir=".tmp/manual-backfill/artifacts/fixtures/$provider_id"
          fixture_id=$(jq -r '.fixtureId' "$dir/manifest.json")
          competition_id=$(jq -r '.fixture.competitionId' "$dir/fixture.json")
          season_id=$(jq -r '.fixture.seasonId' "$dir/fixture.json")
          latest_revision=$(jq -er '.latestRevision' "$dir/guard-report.json")
          same_day_hash=$(jq -r '.sameDayCanonicalHash // "-"' "$dir/guard-report.json")
          fixture_key=$(jq -r '.r2Objects[] | select(.role=="fixture") | .key' "$dir/manifest.json")
          pointer_key=$(jq -r '.r2Objects[] | select(.role=="fixture_pointer") | .key' "$dir/manifest.json")
          rm -f "$dir/current-fixture.json"
          get_log="$dir/current-fixture-get.log"
          if ! npx --yes wrangler@4 r2 object get "$R2_BUCKET/$fixture_key" \
            --file "$dir/current-fixture.json" --remote >"$get_log" 2>&1; then
            grep -Eqi 'not found|does not exist|404' "$get_log" || { cat "$get_log" >&2; exit 1; }
            rm -f "$dir/current-fixture.json"
          fi
          if [ -e "$dir/current-fixture.json" ] && [ ! -s "$dir/current-fixture.json" ]; then
            echo 'R2 returned an empty fixture object.' >&2; exit 1
          fi
          if [ -s "$dir/current-fixture.json" ]; then
            node scripts/v2/reconcile-fixture-revision.js "$dir/current-fixture.json" \
              "$dir/fixture.json" "$dir/reconciled-fixture.json" \
              ".tmp/manual-backfill/d1/d1-corrections/af_fixture_${provider_id}.json" "$latest_revision" "$same_day_hash"
          else
            node scripts/v2/reconcile-fixture-revision.js - "$dir/fixture.json" \
              "$dir/reconciled-fixture.json" \
              ".tmp/manual-backfill/d1/d1-corrections/af_fixture_${provider_id}.json" "$latest_revision" "$same_day_hash"
          fi
          mv "$dir/reconciled-fixture.json" "$dir/fixture.json"
          npx --yes wrangler@4 r2 object put "$R2_BUCKET/$fixture_key" \
            --file "$dir/fixture.json" --content-type application/json --remote
          npx --yes wrangler@4 r2 object put "$R2_BUCKET/$pointer_key" \
            --file "$dir/fixture-pointer.json" --content-type application/json --remote
        done < <(jq -r '.detailFetches[].providerFixtureId' .tmp/manual-backfill/plan.json)
    - name: Publish refreshed standings to R2
      if: true && steps.plan.outputs.action_count != '0'
      shell: bash
      run: |
        set -euo pipefail
        jq -c '.standingsFetches[]' .tmp/manual-backfill/plan.json | while IFS= read -r scope; do
          league=$(jq -r '.league' <<<"$scope")
          season=$(jq -r '.season' <<<"$scope")
          dir=".tmp/manual-backfill/artifacts/standings/$league-$season"
          jq -c '.r2Objects[]' "$dir/manifest.json" | while IFS= read -r object; do
            key=$(jq -r '.key' <<<"$object")
            file=$(jq -r '.file' <<<"$object")
            npx --yes wrangler@4 r2 object put "$R2_BUCKET/$key" \
              --file "$dir/$file" --content-type application/json --remote
          done
        done
    - name: Publish through the protected Admin Worker and verify
      if: true && steps.plan.outputs.action_count != '0'
      run: |
        node scripts/d1/request-admin-ingest.mjs \
          --url "$ADMIN_INGEST_URL" \
          --plan .tmp/manual-backfill/d1/admin-plan.json \
          --report .tmp/manual-backfill/d1/admin-report.json
    - name: Complete recovery checkpoint after verified publication
      if: true && steps.plan.outputs.fixture_count != '0'
      shell: bash
      run: |
        set -euo pipefail
        jq '.status = "complete"' .tmp/manual-backfill/checkpoint.json \
          > .tmp/manual-backfill/completed-checkpoint.json
        npx --yes wrangler@4 r2 object put "$R2_BUCKET/$BACKFILL_CHECKPOINT_KEY" \
          --file .tmp/manual-backfill/completed-checkpoint.json \
          --content-type application/json --remote
    - name: Upload bounded backfill evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: today-final-results-${{ github.run_id }}
        path: |-
          .tmp/manual-backfill/plan.json
          .tmp/manual-backfill/budget.json
          .tmp/manual-backfill/stored-dates.json
          .tmp/manual-backfill/current-budget.json
          .tmp/manual-backfill/paid-usage-start.json
          .tmp/manual-backfill/paid-usage-current.json
          .tmp/manual-backfill/prior-checkpoint.json
          .tmp/manual-backfill/checkpoint.json
          .tmp/manual-backfill/recovery-dates.json
          .tmp/manual-backfill/artifacts/**/manifest.json
          .tmp/manual-backfill/d1/admin-plan.json
          .tmp/manual-backfill/d1/admin-report.json
  
          .tmp/manual-backfill/protected-fixture-before.json
          .tmp/manual-backfill/artifacts/fixtures/1552141/*.json
          .tmp/manual-backfill/d1/d1-corrections/*.json
        if-no-files-found: warn
        retention-days: 14
    needs: result-batch-5
    concurrency:
      group: d1-staging-write
      queue: max
      cancel-in-progress: false
  