name: Deploy Live Acquisition Worker
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/live-worker-deploy.yml'
      - 'live-worker/**'
      - 'migrations/live/**'
      - 'scripts/live/**'
      - 'shared/live-contract.mjs'
      - 'shared/live-detail.mjs'
      - 'scripts/v2/fixture-contract.js'
      - 'config/live-worker-target.json'
      - 'config/public-worker-target.json'
      - 'config/cup-competitions.json'
      - 'shared/cup-snapshot-contract.mjs'
      - '.github/workflows/api-football-live.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: live-worker-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: d1-staging
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      WORKFLOW_DISPATCH_TOKEN: ${{ secrets.WORKFLOW_DISPATCH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Provision the separate live database and verify its schema
        run: node scripts/live/provision.mjs
      - name: Build the acquisition Worker before deployment
        run: npx --yes wrangler@4.147.0 deploy --dry-run --config .tmp/live/wrangler.toml --outdir .tmp/live/build
      - name: Deploy disabled while installing the workflow dispatch credential
        id: bootstrap
        run: npx --yes wrangler@4.147.0 deploy --config .tmp/live/wrangler.toml --var LIVE_ACQUISITION_ENABLED:false
      - name: Install the workflow credential and remove the provider key from the Worker
        shell: bash
        run: |
          set -euo pipefail
          test -n "$WORKFLOW_DISPATCH_TOKEN"
          printf '%s' "$WORKFLOW_DISPATCH_TOKEN" | npx --yes wrangler@4.147.0 secret put WORKFLOW_DISPATCH_TOKEN --config .tmp/live/wrangler.toml
          npx --yes wrangler@4.147.0 secret list --config .tmp/live/wrangler.toml > .tmp/live/secrets.json
          if jq -e 'any(.[]; .name == "API_FOOTBALL_KEY")' .tmp/live/secrets.json >/dev/null; then
            npx --yes wrangler@4.147.0 secret delete API_FOOTBALL_KEY --config .tmp/live/wrangler.toml
          fi
          npx --yes wrangler@4.147.0 secret list --config .tmp/live/wrangler.toml > .tmp/live/secrets.json
          jq -e 'all(.[]; .name != "API_FOOTBALL_KEY")' .tmp/live/secrets.json >/dev/null
      - name: Apply the reviewed acquisition enable switch
        run: npx --yes wrangler@4.147.0 deploy --config .tmp/live/wrangler.toml
      - name: Verify an actual cron heartbeat and successful enabled acquisition
        run: node scripts/live/verify-deployment.mjs
      - name: Verify the provider batch-live response without publishing test data
        run: node scripts/live/verify-provider.mjs
      - name: Disable acquisition after failed activation
        if: ${{ (failure() || cancelled()) && steps.bootstrap.outcome == 'success' }}
        run: npx --yes wrangler@4.147.0 deploy --config .tmp/live/wrangler.toml --var LIVE_ACQUISITION_ENABLED:false
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-acquisition-${{ github.run_id }}
          path: |
            .tmp/live/target.json
            .tmp/live/verification.json
            .tmp/live/provider-verification.json
          retention-days: 14
          if-no-files-found: warn
