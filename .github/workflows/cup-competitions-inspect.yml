name: Inspect and archive cup competitions
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cup-competitions-inspect
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: d1-staging
    timeout-minutes: 10
    env:
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read stored competition counts and retrieve available cup schedules
        run: node scripts/cups/inspect.mjs
      - name: Archive provider data without changing public data or existing acquisition policies
        env:
          R2_BUCKET: ${{ vars.R2_BUCKET }}
        run: |
          test "$R2_BUCKET" = jfw-football-data
          snapshot_key=$(jq -r .snapshotKey .tmp/cups/summary.json)
          npx --yes wrangler@4 r2 object put "$R2_BUCKET/$snapshot_key" --file .tmp/cups/snapshot.json --content-type application/json --remote
          echo 'Cup snapshot archived. No D1 writes or public acquisition policies changed.'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cup-inspection-${{ github.run_id }}
          path: .tmp/cups/summary.json
          retention-days: 30
          if-no-files-found: warn
