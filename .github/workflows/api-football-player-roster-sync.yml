name: API-Football Player Roster Sync

on:
  schedule:
    - cron: '17 2 * * 0'
  workflow_dispatch:
    inputs:
      mode:
        description: Preview or publish the complete ten-league roster
        type: choice
        required: true
        default: preview
        options: [preview, execute]
      confirmation:
        description: For execute, enter RUN PLAYER ROSTER SYNC
        required: false
        type: string

permissions:
  contents: read

jobs:
  provision:
    if: github.event_name == 'schedule' || inputs.mode == 'execute' && inputs.confirmation == 'RUN PLAYER ROSTER SYNC'
    uses: ./.github/workflows/d1-staging-provision.yml
    secrets: inherit

  roster:
    needs: provision
    if: always() && (needs.provision.result == 'success' || github.event_name == 'workflow_dispatch' && inputs.mode == 'preview')
    concurrency:
      group: d1-staging-write
      queue: max
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: d1-staging
    env:
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      ADMIN_INGEST_TOKEN: ${{ secrets.ADMIN_INGEST_TOKEN }}
      ADMIN_INGEST_URL: ${{ vars.ADMIN_INGEST_URL }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_NAME: ${{ vars.D1_DATABASE_NAME }}
      D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
      ADMIN_WORKER_NAME: ${{ vars.ADMIN_WORKER_NAME }}
      R2_BUCKET: ${{ vars.R2_BUCKET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify reviewed D1 target and budget
        env:
          REQUESTED_MODE: ${{ inputs.mode }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          test -n "$API_FOOTBALL_KEY"
          node scripts/d1/verify-d1-target.mjs --manifest config/d1-targets.json --target staging
          if [ "${{ github.event_name }}" = schedule ] || [ "$REQUESTED_MODE" = execute ]; then
            test "$CONFIRMATION" = 'RUN PLAYER ROSTER SYNC' || test "${{ github.event_name }}" = schedule
            test -n "$ADMIN_INGEST_TOKEN" && test -n "$ADMIN_INGEST_URL"
            node scripts/d1/check-paid-backfill-capacity.mjs --out /tmp/player-roster-d1-usage.json
          fi
      - name: Collect complete league player pages and team squads
        env:
          REQUESTED_MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = schedule ] || [ "$REQUESTED_MODE" = execute ]; then
            node scripts/v2/sync-player-roster.mjs --execute
          else
            node scripts/v2/sync-player-roster.mjs
          fi
