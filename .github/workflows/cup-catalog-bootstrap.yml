name: Initialize cup acquisition catalogs
on:
  workflow_run:
    workflows: [Deploy Public Worker]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: d1-staging-write
  queue: max
  cancel-in-progress: false
jobs:
  initialize:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    environment: d1-staging
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ADMIN_INGEST_TOKEN: ${{ secrets.ADMIN_INGEST_TOKEN }}
      ADMIN_INGEST_URL: ${{ vars.ADMIN_INGEST_URL }}
      R2_BUCKET: ${{ vars.R2_BUCKET }}
      D1_DATABASE_NAME: ${{ vars.D1_DATABASE_NAME }}
      D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
      ADMIN_WORKER_NAME: ${{ vars.ADMIN_WORKER_NAME }}
      D1_ADMIN_PUBLISH_ENABLED: ${{ vars.D1_ADMIN_PUBLISH_ENABLED }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify the reviewed target and monthly D1 budget
        run: |
          test "$D1_ADMIN_PUBLISH_ENABLED" = true
          node scripts/d1/verify-d1-target.mjs --manifest config/d1-targets.json --target staging
          node scripts/d1/check-paid-backfill-capacity.mjs --out .tmp/cups/usage.json
      - name: Load the published cup catalog without API-Football calls
        run: |
          test "$R2_BUCKET" = jfw-football-data
          mkdir -p .tmp/cups/public
          npx --yes wrangler@4.147.0 r2 object get "$R2_BUCKET/football/v2/cups/catalog.json" --file .tmp/cups/public/catalog.json --remote
      - name: Initialize only the fourteen reviewed competition-season identities
        run: node scripts/cups/bootstrap-catalog.mjs
