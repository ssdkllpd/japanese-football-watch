name: Tracked Profile Inventory Once

on:
  push:
    branches: [fix/tracked-japanese-profile-link-20261017]
    paths:
      - .github/workflows/tracked-profile-inventory-once.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: d1-staging
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_NAME: ${{ vars.D1_DATABASE_NAME }}
      D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
      ADMIN_WORKER_NAME: ${{ vars.ADMIN_WORKER_NAME }}
      ADMIN_INGEST_URL: ${{ vars.ADMIN_INGEST_URL }}
      R2_BUCKET: ${{ vars.R2_BUCKET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Count stored tracking identities and published matches
        shell: bash
        run: |
          set -euo pipefail
          node scripts/d1/verify-d1-target.mjs --manifest config/d1-targets.json --target staging
          node scripts/d1/render-admin-wrangler.mjs --output .tmp/tracked-profile/wrangler.toml
          config=.tmp/tracked-profile/wrangler.toml
          npx --yes wrangler@4 d1 execute "$D1_DATABASE_NAME" --remote --json --config "$config" \
            --command "SELECT crosswalk_state,tracking_status,COUNT(*) AS players FROM tracked_players GROUP BY crosswalk_state,tracking_status ORDER BY crosswalk_state,tracking_status" > .tmp/tracked-profile/states.json
          npx --yes wrangler@4 d1 execute "$D1_DATABASE_NAME" --remote --json --config "$config" \
            --command "SELECT COUNT(DISTINCT tracked.jfw_player_id) AS players_with_published_appearances FROM tracked_players tracked JOIN fixture_player_records record ON record.player_id=tracked.player_id JOIN fixtures fixture ON fixture.id=record.fixture_id JOIN fixture_player_appearances appearance ON appearance.player_record_id=record.id AND appearance.fixture_revision_id=fixture.published_revision AND appearance.appearance_state IN ('started','substitute_used') JOIN competition_seasons season ON season.id=fixture.competition_season_id JOIN product_seasons product ON product.id=season.product_season_id AND product.canonical_id='jfw:season:2026-27' WHERE tracked.crosswalk_state='resolved' AND EXISTS(SELECT 1 FROM tracking_periods period JOIN player_team_memberships membership ON membership.id=period.core_membership_id WHERE period.jfw_player_id=tracked.jfw_player_id AND membership.player_id=record.player_id AND membership.team_id=record.team_id AND period.competition_season_id=season.id AND period.tracking_status='active' AND fixture.date_jst>=period.valid_from AND fixture.date_jst<period.valid_to)" > .tmp/tracked-profile/published.json
          jq -c '.[0].results' .tmp/tracked-profile/states.json
          jq -c '.[0].results' .tmp/tracked-profile/published.json
