name: D1 Staging Provision

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: d1-staging-provision
  cancel-in-progress: false

jobs:
  apply-schema-and-deploy-admin:
    runs-on: ubuntu-latest
    environment: d1-staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ADMIN_INGEST_TOKEN: ${{ secrets.ADMIN_INGEST_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify exact reviewed staging target
        env:
          ADMIN_WORKER_NAME: ${{ vars.ADMIN_WORKER_NAME }}
          D1_DATABASE_NAME: ${{ vars.D1_DATABASE_NAME }}
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          ADMIN_INGEST_URL: ${{ vars.ADMIN_INGEST_URL }}
        run: |
          node scripts/d1/verify-d1-target.mjs --manifest config/d1-targets.json --target staging
          {
            echo "ADMIN_WORKER_NAME=$ADMIN_WORKER_NAME"
            echo "D1_DATABASE_NAME=$D1_DATABASE_NAME"
            echo "D1_DATABASE_ID=$D1_DATABASE_ID"
            echo "R2_BUCKET=$R2_BUCKET"
          } >> "$GITHUB_ENV"

      - name: Validate protected credentials and render configuration
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'CLOUDFLARE_API_TOKEN is required'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'CLOUDFLARE_ACCOUNT_ID is required'; exit 1; }
          test -n "$ADMIN_INGEST_TOKEN" || { echo 'ADMIN_INGEST_TOKEN is required'; exit 1; }
          node scripts/d1/render-admin-wrangler.mjs --output .tmp/d1-admin-wrangler.toml

      - name: Apply reviewed D1 migrations
        run: >-
          npx --yes wrangler@4 d1 migrations apply "$D1_DATABASE_NAME"
          --config .tmp/d1-admin-wrangler.toml --remote

      - name: Deploy write-only admin Worker
        run: npx --yes wrangler@4 deploy --config .tmp/d1-admin-wrangler.toml

      - name: Install admin ingest secret
        shell: bash
        run: >-
          printf '%s' "$ADMIN_INGEST_TOKEN" |
          npx --yes wrangler@4 secret put ADMIN_INGEST_TOKEN
          --config .tmp/d1-admin-wrangler.toml

      - name: Confirm public flags were not changed
        run: |
          test "$(rg -c '= "false"' worker/wrangler.toml.example)" -ge 4
          ! rg '= "true"' worker/wrangler.toml.example
