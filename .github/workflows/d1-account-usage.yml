name: D1 Account Usage (read only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  usage:
    runs-on: ubuntu-latest
    environment: d1-staging
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read account-wide D1 rows written for the current UTC date
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
        run: node scripts/d1/report-account-usage.mjs
      - name: Upload aggregate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d1-account-usage-report
          path: .tmp/d1-account-usage/report.json
          if-no-files-found: warn
          retention-days: 7
