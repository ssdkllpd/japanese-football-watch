name: Publish cup schedules and standings
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - config/cup-competitions.json
      - scripts/cups/prepare.mjs
      - scripts/cups/publish.mjs
      - scripts/cups/refresh.mjs
      - .github/workflows/cup-competitions-publish.yml
permissions:
  contents: read
concurrency:
  group: d1-staging-write
  queue: max
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: d1-staging
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      ADMIN_INGEST_TOKEN: ${{ secrets.ADMIN_INGEST_TOKEN }}
      ADMIN_INGEST_URL: ${{ vars.ADMIN_INGEST_URL }}
      D1_DATABASE_NAME: ${{ vars.D1_DATABASE_NAME }}
      D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
      ADMIN_WORKER_NAME: ${{ vars.ADMIN_WORKER_NAME }}
      D1_ADMIN_PUBLISH_ENABLED: ${{ vars.D1_ADMIN_PUBLISH_ENABLED }}
      R2_BUCKET: ${{ vars.R2_BUCKET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned R2 CLI
        run: npm install --prefix .tmp/cup-tools --ignore-scripts --no-audit --no-fund wrangler@4.147.0
      - name: Verify target and refresh complete cup schedules through the shared protected catalog publisher
        run: |
          test "$D1_ADMIN_PUBLISH_ENABLED" = true
          node scripts/d1/verify-d1-target.mjs --manifest config/d1-targets.json --target staging
          node scripts/d1/check-paid-backfill-capacity.mjs --out .tmp/cups/usage.json
          node scripts/cups/refresh.mjs
      - name: Verify public directory, schedules and UEFA tables after deployment
        if: github.ref == 'refs/heads/main'
        run: node scripts/cups/verify-public.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cup-publication-${{ github.run_id }}
          path: .tmp/cups/public/catalog.json
          retention-days: 30
          if-no-files-found: warn
