name: API-Football Schedule Preview Once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/api-football-schedule-preview-once.yml

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: d1-staging
    env:
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_NAME: ${{ vars.D1_DATABASE_NAME }}
      D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
      ADMIN_WORKER_NAME: ${{ vars.ADMIN_WORKER_NAME }}
      ADMIN_INGEST_URL: ${{ vars.ADMIN_INGEST_URL }}
      R2_BUCKET: ${{ vars.R2_BUCKET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify target and fetch stored fixture inventory
        shell: bash
        run: |
          set -euo pipefail
          node scripts/d1/verify-d1-target.mjs --manifest config/d1-targets.json --target staging
          mkdir -p .tmp/schedule-preview
          node scripts/d1/render-admin-wrangler.mjs --output .tmp/schedule-preview/wrangler.toml
          npx --yes wrangler@4 d1 execute "$D1_DATABASE_NAME" --remote --json \
            --config .tmp/schedule-preview/wrangler.toml \
            --command "SELECT fixture.canonical_id AS fixture_id, competition.canonical_id AS competition_id, season.canonical_id AS season_id, fixture.kickoff_utc, fixture.status_short, fixture.published_revision, COUNT(*) OVER () AS total FROM fixtures fixture JOIN competition_seasons season ON season.id=fixture.competition_season_id JOIN competitions competition ON competition.id=season.competition_id WHERE season.canonical_id IN ('af:season:39:2026','af:season:40:2026','af:season:61:2026','af:season:78:2026','af:season:88:2026','af:season:94:2026','af:season:135:2026','af:season:140:2026','af:season:144:2026','af:season:179:2026') ORDER BY fixture.canonical_id" \
            > .tmp/schedule-preview/inventory.json
      - name: Read all ten provider seasons and output differences
        run: node scripts/v2/plan-fixture-schedule-sync.js .tmp/schedule-preview/inventory.json .tmp/schedule-preview/plan.json
      - name: Inspect plan summary
        if: success()
        run: |
          jq '{scanned, changeCount:(.changes|length), heldCount:(.held|length), executable,
            dailyRemaining, heldReasons:(.held|group_by(.reason)|map({reason:.[0].reason,count:length}))}' \
            .tmp/schedule-preview/plan.json
      - name: Upload read-only schedule preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prematch-schedule-preview-${{ github.run_id }}
          path: .tmp/schedule-preview/plan.json
          if-no-files-found: warn
          retention-days: 14
