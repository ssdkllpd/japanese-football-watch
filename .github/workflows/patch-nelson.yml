name: Patch verified insights
on:
  push:
    paths:
      - '.github/workflows/patch-nelson.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch verified insights
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('data.json')
          d=json.loads(p.read_text())
          changed=False

          insight={
            'player':'石渡ネルソン',
            'fact':'STVV加入後、リーグ開幕から2試合連続先発。第1節で1アシスト、第2節で加入後初ゴールを記録し、2試合連続で得点に直接関与している。',
            'why':'新加入直後から先発を確保し、守備的・中盤寄りの登録選手でありながら2試合連続で直接G/Aを残している点が注目材料。STVV加入時にもクラブは、攻守両面への貢献、走力、両足を使える点を評価していた。',
            'sources':['STVV公式選手加入発表','確認済み第1節・第2節試合データ']
          }
          ins=d.setdefault('insights',[])
          old=next((x for x in ins if x.get('player')=='石渡ネルソン'),None)
          if old!=insight:
              d['insights']=[x for x in ins if x.get('player')!='石渡ネルソン']+[insight]
              changed=True

          analysis={
            'player':'石渡ネルソン',
            'confidence':'medium',
            'text':'現時点で確認できるのは「2試合連続先発」と「1G1A」という結果面まで。少なくとも加入直後の適応と監督からの起用信頼は順調とみられる。一方、得点関与の増加がプレー位置の高さ、前進回数、シュート数などの変化によるものかは詳細スタッツ不足のため断定できない。今後はタッチ位置、ボール奪取、前進パス、シュート関与を継続取得できれば、好調の要因まで分析可能。'
          }
          ana=d.setdefault('analysis',[])
          olda=next((x for x in ana if x.get('player')=='石渡ネルソン'),None)
          if olda!=analysis:
              d['analysis']=[x for x in ana if x.get('player')!='石渡ネルソン']+[analysis]
              changed=True

          if changed:
              d['updated']='2026-08-20 06:00 JST'
              p.write_text(json.dumps(d,ensure_ascii=False,separators=(',',':'))+'\n')
          PY
      - name: Commit patch
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add data.json
          git diff --cached --quiet || git commit -m "Add verified Nelson insight and analysis"
          git push
