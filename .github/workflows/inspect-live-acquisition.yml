name: Inspect Live Acquisition
on:
  push:
    branches: [ops/inspect-live-acquisition-20261016]
    paths: ['.github/workflows/inspect-live-acquisition.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: d1-staging
    timeout-minutes: 3
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inspect live database and scheduled Worker without provider calls
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const base='https://api.cloudflare.com/client/v4/accounts/'+process.env.CLOUDFLARE_ACCOUNT_ID;
          async function read(path,options={}) {
            const r=await fetch(base+path,{...options,headers:{authorization:'Bearer '+process.env.CLOUDFLARE_API_TOKEN,'content-type':'application/json'},redirect:'error',signal:AbortSignal.timeout(20000)});
            if(!r.ok) throw new Error('Inspection HTTP '+r.status);
            const b=await r.json();if(b.success!==true) throw new Error('Inspection failed');return b.result;
          }
          const dbs=await read('/d1/database?per_page=100');
          const db=dbs.find(x=>x.name==='jfw-football-live');
          if(!db) throw new Error('Live database missing');
          console.log(JSON.stringify({databaseId:db.uuid,name:db.name}));
          const prefix='/workers/scripts/jfw-football-live-acquisition';
          const settings=await read(prefix+'/settings');
          console.log(JSON.stringify({bindings:settings.bindings.map(x=>({name:x.name,type:x.type,...(x.type==='plain_text'?{text:x.text}:{}),...(x.type==='d1'?{databaseId:x.id}:{})}))}));
          console.log(JSON.stringify({schedules:await read(prefix+'/schedules')}));
          for(const sql of ['SELECT * FROM live_control','SELECT * FROM live_budget ORDER BY utc_day DESC LIMIT 1','SELECT fixture_id,status,kickoff_ms,check_2h_ms,check_1h_ms FROM live_schedule ORDER BY kickoff_ms LIMIT 5','SELECT COUNT(*) AS snapshots FROM live_snapshots']) {
            const rows=await read('/d1/database/'+db.uuid+'/query',{method:'POST',body:JSON.stringify({sql})});
            console.log(JSON.stringify({sql,rows:rows[0].results}));
          }
          NODE
