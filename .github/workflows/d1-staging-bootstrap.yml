name: D1 Staging Bootstrap

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: d1-staging-bootstrap
  cancel-in-progress: false

jobs:
  publish-reviewed-fixed-snapshot:
    runs-on: ubuntu-latest
    environment: d1-staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ADMIN_INGEST_TOKEN: ${{ secrets.ADMIN_INGEST_TOKEN }}
      ADMIN_INGEST_URL: ${{ vars.ADMIN_INGEST_URL }}
      R2_BUCKET: ${{ vars.R2_BUCKET }}
      FIXED_SNAPSHOT_SHA256: bfda9fa6e3bfdc5abaf1e37ffe1dc9962b7a557756be08bc3d1c366c4ba1fe49
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate protected environment
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'CLOUDFLARE_API_TOKEN is required'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'CLOUDFLARE_ACCOUNT_ID is required'; exit 1; }
          test -n "$ADMIN_INGEST_TOKEN" || { echo 'ADMIN_INGEST_TOKEN is required'; exit 1; }
          test -n "$ADMIN_INGEST_URL" || { echo 'ADMIN_INGEST_URL is required'; exit 1; }
          test -n "$R2_BUCKET" || { echo 'R2_BUCKET is required'; exit 1; }

      - name: Rebuild reviewed fixed snapshot
        run: |
          mkdir -p .tmp/d1-bootstrap
          node scripts/d1/create-current-fixed-snapshot.js \
            --output .tmp/d1-bootstrap/fixed-snapshot.json \
            --created-at 2026-08-31T00:30:00.000Z \
            --starts-on 2026-07-01 --ends-on 2027-06-30 \
            > .tmp/d1-bootstrap/generated-sha256.txt
          test "$(tr -d '\n' < .tmp/d1-bootstrap/generated-sha256.txt)" = "$FIXED_SNAPSHOT_SHA256"
          test "$(sha256sum .tmp/d1-bootstrap/fixed-snapshot.json | cut -d' ' -f1)" = "$FIXED_SNAPSHOT_SHA256"

      - name: Store content-addressed fixed snapshot in R2
        run: |
          key="migration/fixed-snapshots/$FIXED_SNAPSHOT_SHA256.json"
          npx --yes wrangler@4 r2 object put "$R2_BUCKET/$key" \
            --file .tmp/d1-bootstrap/fixed-snapshot.json --content-type application/json --remote
          npx --yes wrangler@4 r2 object get "$R2_BUCKET/$key" \
            --file .tmp/d1-bootstrap/fixed-snapshot-r2.json --remote
          test "$(sha256sum .tmp/d1-bootstrap/fixed-snapshot-r2.json | cut -d' ' -f1)" = "$FIXED_SNAPSHOT_SHA256"

      - name: Build externally scoped bootstrap plan
        run: |
          jq -n --arg hash "$FIXED_SNAPSHOT_SHA256" '{
            schemaVersion: "jfw-d1-admin-ingest-plan/1",
            fixedSnapshot: {
              artifactSha256: $hash,
              productSeasonId: "jfw:season:2026-27"
            },
            standings: [],
            fixtures: []
          }' > .tmp/d1-bootstrap/plan.json

      - name: Publish fixed snapshot through admin Worker
        run: |
          node scripts/d1/request-admin-ingest.mjs \
            --url "$ADMIN_INGEST_URL" \
            --plan .tmp/d1-bootstrap/plan.json \
            --report .tmp/d1-bootstrap/report.json

      - name: Upload immutable bootstrap evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d1-staging-bootstrap-${{ github.sha }}
          path: .tmp/d1-bootstrap
          if-no-files-found: error
