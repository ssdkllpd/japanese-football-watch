name: API-Football Schedule Rollout Once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/api-football-schedule-rollout-once.yml

permissions:
  contents: read

jobs:
  provision:
    uses: ./.github/workflows/d1-staging-provision.yml
    secrets: inherit

  synchronize:
    needs: provision
    concurrency:
      group: d1-staging-write
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: d1-staging
    env:
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_NAME: ${{ vars.D1_DATABASE_NAME }}
      D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
      ADMIN_WORKER_NAME: ${{ vars.ADMIN_WORKER_NAME }}
      ADMIN_INGEST_URL: ${{ vars.ADMIN_INGEST_URL }}
      ADMIN_INGEST_TOKEN: ${{ secrets.ADMIN_INGEST_TOKEN }}
      D1_ADMIN_PUBLISH_ENABLED: ${{ vars.D1_ADMIN_PUBLISH_ENABLED }}
      R2_BUCKET: ${{ vars.R2_BUCKET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify staging scope, write gate, and monthly capacity
        shell: bash
        run: |
          set -euo pipefail
          test "$D1_ADMIN_PUBLISH_ENABLED" = true
          test -n "$API_FOOTBALL_KEY" && test -n "$ADMIN_INGEST_TOKEN"
          node scripts/d1/verify-d1-target.mjs --manifest config/d1-targets.json --target staging
          mkdir -p .tmp/schedule-rollout
          node scripts/d1/check-paid-backfill-capacity.mjs --out .tmp/schedule-rollout/usage.json
          node scripts/d1/execute-fixture-schedule-plan.mjs repair
      - name: Read stored fixture inventory
        shell: bash
        run: |
          set -euo pipefail
          node scripts/d1/render-admin-wrangler.mjs --output .tmp/schedule-rollout/wrangler.toml
          npx --yes wrangler@4 d1 execute "$D1_DATABASE_NAME" --remote --json \
            --config .tmp/schedule-rollout/wrangler.toml \
            --command "SELECT fixture.canonical_id AS fixture_id, competition.canonical_id AS competition_id, season.canonical_id AS season_id, fixture.kickoff_utc, fixture.status_short, fixture.published_revision, COUNT(*) OVER () AS total FROM fixtures fixture JOIN competition_seasons season ON season.id=fixture.competition_season_id JOIN competitions competition ON competition.id=season.competition_id WHERE season.canonical_id IN ('af:season:39:2026','af:season:40:2026','af:season:61:2026','af:season:78:2026','af:season:88:2026','af:season:94:2026','af:season:135:2026','af:season:140:2026','af:season:144:2026','af:season:179:2026') ORDER BY fixture.canonical_id" \
            > .tmp/schedule-rollout/inventory.json
      - name: Reconfirm exact independently previewed changes before writing
        shell: bash
        run: |
          set -euo pipefail
          node scripts/v2/plan-fixture-schedule-sync.js \
            .tmp/schedule-rollout/inventory.json .tmp/schedule-rollout/plan.json
          digest=$(jq -c '.changes' .tmp/schedule-rollout/plan.json | sha256sum | cut -d ' ' -f1)
          test "$digest" = '9e1368e59c8b1934a1715a88608207a6cf0352c2b0686822faf238b32ed8ae90'
          jq -e '.scanned == 3420 and (.changes | length) == 217
            and (.held | length) == 1 and .held[0].fixtureId == "af:fixture:1552141"' \
            .tmp/schedule-rollout/plan.json >/dev/null
      - name: Apply reviewed schedule changes with per-batch paid guard and index repair
        run: node scripts/d1/execute-fixture-schedule-plan.mjs execute .tmp/schedule-rollout/plan.json --all
      - name: Upload rollout evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: schedule-rollout-${{ github.run_id }}
          path: |
            .tmp/schedule-rollout/plan.json
            .tmp/schedule-rollout/usage.json
          if-no-files-found: warn
          retention-days: 14
