name: Inspect Cloudflare Dispatcher Once
on:
  push:
    branches: [ops/inspect-dispatcher-20261016]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: d1-staging
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare read-only inspection
        run: |
          node scripts/v2/render-workflow-dispatcher.mjs --output .tmp/dispatcher-inspect/wrangler.toml
          npx --yes wrangler@4.147.0 --version
      - name: Read configured cron
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --connect-timeout 5 --max-time 20 \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/jfw-football-workflow-dispatcher/schedules" \
            --output .tmp/dispatcher-inspect/schedules.json
          jq '{success, errors, result}' .tmp/dispatcher-inspect/schedules.json
      - name: Read effective dispatcher bindings
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --connect-timeout 5 --max-time 20 \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/jfw-football-workflow-dispatcher/settings" \
            --output .tmp/dispatcher-inspect/settings.json
          jq '{success, dispatch: [.result.bindings[]? | select(.name == "DISPATCH_ENABLED" or .name == "DISPATCH_EPOCH") | {name, type, text}], credentialPresent: any(.result.bindings[]?; .name == "WORKFLOW_DISPATCH_TOKEN" and .type == "secret_text")}' .tmp/dispatcher-inspect/settings.json
      - name: Observe dispatcher logs for one minute
        shell: bash
        run: |
          set +e
          timeout 60s npx --yes wrangler@4.147.0 tail --config .tmp/dispatcher-inspect/wrangler.toml --format json > .tmp/dispatcher-inspect/tail.jsonl 2>&1
          status=$?
          cat .tmp/dispatcher-inspect/tail.jsonl
          if [ "$status" != 0 ] && [ "$status" != 124 ]; then exit "$status"; fi
