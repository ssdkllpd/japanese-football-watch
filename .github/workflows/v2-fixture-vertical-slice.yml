name: V2 Fixture Vertical Slice

on:
  workflow_dispatch:
    inputs:
      fixture_id:
        description: API-Football fixture ID to normalize and publish
        required: true
        type: string
      mark_finalized:
        description: Mark a final-status fixture as finalized instead of provisional_final
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  export-and-publish:
    runs-on: ubuntu-latest
    env:
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      R2_BUCKET: ${{ vars.R2_BUCKET }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate required secrets and variables
        run: |
          test -n "$API_FOOTBALL_KEY" || { echo 'API_FOOTBALL_KEY secret is required'; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'CLOUDFLARE_API_TOKEN secret is required'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'CLOUDFLARE_ACCOUNT_ID secret is required'; exit 1; }
          test -n "$R2_BUCKET" || { echo 'R2_BUCKET repository variable is required'; exit 1; }

      - name: Fetch and normalize one fixture
        run: |
          node scripts/v2/fetch-fixture-vertical-slice.js \
            --fixture "${{ inputs.fixture_id }}" \
            --finalized "${{ inputs.mark_finalized }}" \
            --out .tmp/v2/fixture

      - name: Read publish manifest
        id: manifest
        run: |
          echo "fixture_key=$(jq -r '.r2Objects[] | select(.role=="fixture") | .key' .tmp/v2/fixture/manifest.json)" >> "$GITHUB_OUTPUT"
          echo "pointer_key=$(jq -r '.r2Objects[] | select(.role=="fixture_pointer") | .key' .tmp/v2/fixture/manifest.json)" >> "$GITHUB_OUTPUT"
          echo "date_key=$(jq -r '.r2Objects[] | select(.role=="date_index") | .key' .tmp/v2/fixture/manifest.json)" >> "$GITHUB_OUTPUT"
          echo "ingestion_state=$(jq -r '.ingestionState' .tmp/v2/fixture/manifest.json)" >> "$GITHUB_OUTPUT"
          echo "date_merge_scope=$(jq -r '.r2Objects[] | select(.role==\"date_index\") | .mergeScope' .tmp/v2/fixture/manifest.json)" >> "$GITHUB_OUTPUT"
          echo "date_merge_mode=$(jq -r '.r2Objects[] | select(.role==\"date_index\") | .mergeMode' .tmp/v2/fixture/manifest.json)" >> "$GITHUB_OUTPUT"

      - name: Merge existing JST date index when present
        run: |
          rm -f .tmp/v2/current-date-index.json .tmp/v2/merged-date-index.json
          get_log=.tmp/v2/current-date-index-get.log
          if ! npx --yes wrangler@4 r2 object get "$R2_BUCKET/${{ steps.manifest.outputs.date_key }}" \
            --file .tmp/v2/current-date-index.json --remote >"$get_log" 2>&1; then
            if grep -Eqi 'not found|does not exist|404' "$get_log"; then
              rm -f .tmp/v2/current-date-index.json
            else
              cat "$get_log" >&2
              exit 1
            fi
          fi
          if [ -e .tmp/v2/current-date-index.json ] && [ ! -s .tmp/v2/current-date-index.json ]; then
            echo 'R2 returned an empty date index; refusing to overwrite it.' >&2
            exit 1
          fi
          if [ -s .tmp/v2/current-date-index.json ]; then
            node scripts/v2/merge-date-index.js \
              .tmp/v2/current-date-index.json \
              .tmp/v2/fixture/date-index.json \
              .tmp/v2/merged-date-index.json \
              "${{ steps.manifest.outputs.date_merge_scope }}" \
              "${{ steps.manifest.outputs.date_merge_mode }}"
          else
            node scripts/v2/merge-date-index.js \
              - \
              .tmp/v2/fixture/date-index.json \
              .tmp/v2/merged-date-index.json \
              "${{ steps.manifest.outputs.date_merge_scope }}" \
              "${{ steps.manifest.outputs.date_merge_mode }}"
          fi

      - name: Reconcile canonical fixture revision
        shell: bash
        run: |
          current=.tmp/v2/current-fixture.json
          reconciled=.tmp/v2/reconciled-fixture.json
          get_log=.tmp/v2/current-fixture-get.log
          rm -f "$current" "$reconciled" "$get_log"
          if ! npx --yes wrangler@4 r2 object get "$R2_BUCKET/${{ steps.manifest.outputs.fixture_key }}" \
            --file "$current" --remote >"$get_log" 2>&1; then
            if grep -Eqi 'not found|does not exist|404' "$get_log"; then
              rm -f "$current"
            else
              cat "$get_log" >&2
              exit 1
            fi
          fi
          if [ -e "$current" ] && [ ! -s "$current" ]; then
            echo 'R2 returned an empty fixture bundle; refusing to overwrite it.' >&2
            exit 1
          fi
          if [ -s "$current" ]; then
            node scripts/v2/reconcile-fixture-revision.js \
              "$current" .tmp/v2/fixture/fixture.json "$reconciled"
          else
            node scripts/v2/reconcile-fixture-revision.js \
              - .tmp/v2/fixture/fixture.json "$reconciled"
          fi
          mv "$reconciled" .tmp/v2/fixture/fixture.json

      - name: Publish canonical fixture bundle
        run: |
          npx --yes wrangler@4 r2 object put "$R2_BUCKET/${{ steps.manifest.outputs.fixture_key }}" \
            --file .tmp/v2/fixture/fixture.json --content-type application/json --remote

      - name: Publish fixture lookup pointer
        run: |
          npx --yes wrangler@4 r2 object put "$R2_BUCKET/${{ steps.manifest.outputs.pointer_key }}" \
            --file .tmp/v2/fixture/fixture-pointer.json --content-type application/json --remote

      - name: Publish merged JST date index
        run: |
          npx --yes wrangler@4 r2 object put "$R2_BUCKET/${{ steps.manifest.outputs.date_key }}" \
            --file .tmp/v2/merged-date-index.json --content-type application/json --remote

      - name: Vertical slice summary
        run: |
          echo "Fixture: ${{ inputs.fixture_id }}"
          echo "Ingestion state: ${{ steps.manifest.outputs.ingestion_state }}"
          echo "R2 fixture: ${{ steps.manifest.outputs.fixture_key }}"
          echo "R2 date index: ${{ steps.manifest.outputs.date_key }}"

      - name: Upload normalized vertical slice artifact
        uses: actions/upload-artifact@v4
        with:
          name: v2-fixture-${{ inputs.fixture_id }}
          path: .tmp/v2/fixture
          if-no-files-found: error

  mirror-fixture-to-d1:
    needs: export-and-publish
    runs-on: ubuntu-latest
    environment: d1-staging
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify exact reviewed staging target
        id: target
        env:
          D1_ADMIN_PUBLISH_ENABLED: ${{ vars.D1_ADMIN_PUBLISH_ENABLED }}
          ADMIN_WORKER_NAME: ${{ vars.ADMIN_WORKER_NAME }}
          D1_DATABASE_NAME: ${{ vars.D1_DATABASE_NAME }}
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          ADMIN_INGEST_URL: ${{ vars.ADMIN_INGEST_URL }}
        run: |
          if [ "$D1_ADMIN_PUBLISH_ENABLED" != 'true' ]; then
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          node scripts/d1/verify-d1-target.mjs --manifest config/d1-targets.json --target staging
          echo 'enabled=true' >> "$GITHUB_OUTPUT"
          echo "ADMIN_INGEST_URL=$ADMIN_INGEST_URL" >> "$GITHUB_ENV"

      - name: Download normalized fixture artifact
        if: steps.target.outputs.enabled == 'true'
        uses: actions/download-artifact@v4
        with:
          name: v2-fixture-${{ inputs.fixture_id }}
          path: .tmp/v2/fixture

      - name: Mirror fixture through protected admin ingest
        if: steps.target.outputs.enabled == 'true'
        shell: bash
        env:
          ADMIN_INGEST_TOKEN: ${{ secrets.ADMIN_INGEST_TOKEN }}
        run: |
          test -n "$ADMIN_INGEST_URL" || { echo 'ADMIN_INGEST_URL is required'; exit 1; }
          test -n "$ADMIN_INGEST_TOKEN" || { echo 'ADMIN_INGEST_TOKEN is required'; exit 1; }
          node scripts/d1/create-v2-admin-plan.js \
            --manifest .tmp/v2/fixture/manifest.json \
            --output .tmp/v2/fixture/d1-admin-plan.json
          node scripts/d1/request-admin-ingest.mjs \
            --url "$ADMIN_INGEST_URL" \
            --plan .tmp/v2/fixture/d1-admin-plan.json \
            --report .tmp/v2/fixture/d1-admin-report.json

      - name: Upload D1 mirror evidence
        if: always() && steps.target.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: d1-fixture-${{ inputs.fixture_id }}-${{ github.sha }}
          path: .tmp/v2/fixture/d1-admin-*.json
          if-no-files-found: error
