name: Normalize hardening review diff
on:
  push:
    branches:
      - fix/runtime-hardening-2026-08-21
    paths:
      - '.github/workflows/cleanup-hardening-review.yml'
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/runtime-hardening-2026-08-21
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Keep the legacy fragment diff semantic-only
        run: |
          git show origin/main:data/2026-27/backfill/latest-2026-08-20.json > /tmp/latest-main.json
          python - <<'PY'
          from pathlib import Path
          src = Path('/tmp/latest-main.json').read_text()
          old = 'カップ戦個人記録はplayerMatchStatsに含めるが、players.statsのリーグ集計には加算しない。'
          new = '現行仕様では players.stats / seasonStats の「すべて」は、追跡対象期間の全公式戦通算（親善・プレシーズン除外）。リーグ・カップ等の大会別表示は competitionStats を使用する。'
          if src.count(old) != 1:
              raise SystemExit(f'expected one stale scope note, found {src.count(old)}')
          Path('data/2026-27/backfill/latest-2026-08-20.json').write_text(src.replace(old, new, 1))
          PY
      - name: Align retained snapshot with hardened runtime
        run: |
          export BACKFILL_SHA=$(git hash-object backfill-loader.js)
          export REGISTRY_SHA=$(git hash-object config/player-registry.json)
          python - <<'PY'
          import json, os
          from pathlib import Path
          p = Path('state/latest_snapshot.json')
          d = json.loads(p.read_text())
          d['updatedAt'] = '2026-08-21T17:30:00+09:00'
          d['purpose'] = "Reproducible integrated snapshot for the overseas Japanese-player tracker after API-Football manifest synchronization and runtime-hardening: fail-closed current-season overlays, explicit player registry, shared runtime merge semantics, and aggregate regression guards."
          runtime = d.setdefault('runtime', [])
          if 'config/player-registry.json' not in runtime:
              runtime.append('config/player-registry.json')
          blobs = d.setdefault('runtimeBlobs', {})
          blobs['backfill-loader.js'] = os.environ['BACKFILL_SHA']
          blobs['config/player-registry.json'] = os.environ['REGISTRY_SHA']
          validation = d.setdefault('validation', {})
          validation['currentSeasonOverlayFailureFailsClosed'] = True
          validation['runtimeIdentityUsesExplicitRegistry'] = True
          validation['baselineDoubleCountRegressionCovered'] = True
          validation['allCompetitionsIncludesOfficialCups'] = True
          validation['scheduledSynchronizationEnabled'] = False
          d['verifiedCorrections'] = [x.replace('workflow_policy v13', 'workflow_policy v20') for x in d.get('verifiedCorrections', [])]
          d['declaredCoverageGaps'] = [x.replace('workflow_policy v13', 'workflow_policy v20') for x in d.get('declaredCoverageGaps', [])]
          p.write_text(json.dumps(d, ensure_ascii=False, indent=2) + '\n')
          PY
      - name: Guard snapshot runtime blobs in tests
        run: |
          cat > tests/snapshot-manifest-consistency.test.js <<'EOF'
          const test = require('node:test');
          const assert = require('node:assert/strict');
          const crypto = require('node:crypto');
          const fs = require('node:fs');
          const path = require('node:path');

          const ROOT = path.join(__dirname, '..');
          const readJson = rel => JSON.parse(fs.readFileSync(path.join(ROOT, rel), 'utf8'));
          const gitBlobSha = rel => {
            const body = fs.readFileSync(path.join(ROOT, rel));
            const header = Buffer.from(`blob ${body.length}\0`);
            return crypto.createHash('sha1').update(Buffer.concat([header, body])).digest('hex');
          };

          test('retained snapshot mirrors current-season backfill manifest and runtime dependencies', () => {
            const seasons = readJson('seasons.json');
            const manifestPath = `data/${seasons.current}/backfill/index.json`;
            const manifest = readJson(manifestPath);
            const snapshot = readJson('state/latest_snapshot.json');

            assert.equal(snapshot.season, seasons.current);
            assert.equal(snapshot.overlayManifest.path, manifestPath);
            assert.deepEqual(snapshot.overlayManifest.orderedFragments, manifest.fragments);
            assert.equal(snapshot.runtimeBlobs['backfill-loader.js'], gitBlobSha('backfill-loader.js'));
            assert.equal(snapshot.runtimeBlobs['config/player-registry.json'], gitBlobSha('config/player-registry.json'));
          });
          EOF
      - name: Run full test suite
        run: node --test tests/*.test.js
      - name: Commit normalized review diff
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -- data/2026-27/backfill/latest-2026-08-20.json state/latest_snapshot.json tests/snapshot-manifest-consistency.test.js
          git diff --cached --quiet || git commit -m "Align runtime snapshot and minimize review noise"
          git push origin HEAD:fix/runtime-hardening-2026-08-21
