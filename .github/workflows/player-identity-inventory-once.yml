name: Player Identity Inventory Once

on:
  push:
    branches: [fix/tracked-japanese-profile-link-20261017]
    paths:
      - .github/workflows/player-identity-inventory-once.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: d1-staging
    timeout-minutes: 10
    env:
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Query bounded missing player identities
        run: |
          set -euo pipefail
          mkdir -p .tmp/player-identities
          node <<'NODE'
          const fs=require('fs');
          const {createClientFromEnv}=require('./scripts/api-football/client');
          (async()=>{
            const client=createClientFromEnv(process.env,{minimumIntervalMs:350,dailyReserve:100});
            await client.refreshDailyQuota();
            const searches=[{search:'Ryotaro',team:735,season:2026},{search:'Keito',league:78,season:2026},{search:'Ogawa',league:98,season:2026}];
            const ids=[];
            const result={observedAt:new Date().toISOString(),queries:[],initialRemaining:client.lastQuota.dailyRemaining};
            for(const [endpoint,params] of [...searches.map(query=>['players',query]),...ids.map(id=>['players',{id,season:2026}])]){
              try{
                const response=await client.get(endpoint,params);
                result.queries.push({params,paging:response.data.paging,rows:(response.data.response||[]).map(item=>({player:item.player,statistics:(item.statistics||[]).map(s=>({team:s.team,league:s.league}))}))});
              }catch(error){result.queries.push({params,error:{name:error.name,status:error.status,apiErrors:error.apiErrors}})}
            }
            result.finalRemaining=client.lastQuota.dailyRemaining;
            fs.writeFileSync('.tmp/player-identities/result.json',JSON.stringify(result));
            console.log(JSON.stringify({requests:result.queries.length,results:result.queries.map(q=>({params:q.params,count:q.rows?.length||0,error:q.error||null})),initialRemaining:result.initialRemaining,finalRemaining:result.finalRemaining}));
          })().catch(error=>{console.error(error.message);process.exitCode=1});
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: bounded-player-identities
          path: .tmp/player-identities/result.json
          retention-days: 2
