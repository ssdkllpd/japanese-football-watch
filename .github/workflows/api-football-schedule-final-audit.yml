name: API-Football Schedule Final Audit

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/api-football-schedule-final-audit.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: d1-staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_NAME: ${{ vars.D1_DATABASE_NAME }}
      D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
      ADMIN_WORKER_NAME: ${{ vars.ADMIN_WORKER_NAME }}
      ADMIN_INGEST_URL: ${{ vars.ADMIN_INGEST_URL }}
      R2_BUCKET: ${{ vars.R2_BUCKET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read D1 fixtures and date coverages without writes
        shell: bash
        run: |
          set -euo pipefail
          node scripts/d1/verify-d1-target.mjs --manifest config/d1-targets.json --target staging
          mkdir -p .tmp/schedule-final-audit
          node scripts/d1/render-admin-wrangler.mjs --output .tmp/schedule-final-audit/wrangler.toml
          config=.tmp/schedule-final-audit/wrangler.toml
          out=.tmp/schedule-final-audit
          npx --yes wrangler@4 d1 execute "$D1_DATABASE_NAME" --remote --json --config "$config" \
            --command "SELECT fixture.canonical_id AS fixture_id, competition.canonical_id AS competition_id, season.canonical_id AS season_id, fixture.kickoff_utc, fixture.date_jst, fixture.status_short, fixture.published_revision FROM fixtures fixture JOIN competition_seasons season ON season.id=fixture.competition_season_id JOIN competitions competition ON competition.id=season.competition_id WHERE season.canonical_id IN ('af:season:39:2026','af:season:40:2026','af:season:61:2026','af:season:78:2026','af:season:88:2026','af:season:94:2026','af:season:135:2026','af:season:140:2026','af:season:144:2026','af:season:179:2026') ORDER BY fixture.canonical_id" > "$out/fixtures.json"
          npx --yes wrangler@4 d1 execute "$D1_DATABASE_NAME" --remote --json --config "$config" \
            --command "SELECT date_jst,fixture_count,fixture_id_digest FROM date_index_coverages ORDER BY date_jst" > "$out/dates.json"
          npx --yes wrangler@4 d1 execute "$D1_DATABASE_NAME" --remote --json --config "$config" \
            --command "SELECT competition.canonical_id AS competition_id,coverage.date_jst,coverage.fixture_count,coverage.fixture_id_digest FROM competition_date_index_coverages coverage JOIN competitions competition ON competition.id=coverage.competition_id ORDER BY competition.canonical_id,coverage.date_jst" > "$out/competition-dates.json"
          npx --yes wrangler@4 d1 execute "$D1_DATABASE_NAME" --remote --json --config "$config" \
            --command "SELECT fixture_id FROM fixture_schedule_refresh_pending ORDER BY fixture_id" > "$out/pending.json"
      - name: Compare the 217 previewed changes with D1 and affected date coverages
        run: |
          node scripts/d1/audit-fixture-schedule-sync.mjs \
            config/reviewed-schedule-preview-20260930.json \
            .tmp/schedule-final-audit/fixtures.json \
            .tmp/schedule-final-audit/dates.json \
            .tmp/schedule-final-audit/competition-dates.json \
            .tmp/schedule-final-audit/pending.json
          node scripts/d1/check-paid-backfill-capacity.mjs --out .tmp/schedule-final-audit/usage.json
      - name: Upload read-only audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: schedule-final-audit-${{ github.run_id }}
          path: |
            .tmp/schedule-final-audit/usage.json
            .tmp/schedule-final-audit/pending.json
          if-no-files-found: warn
          retention-days: 14
