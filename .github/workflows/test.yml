name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Capture full-suite result
        shell: bash
        run: |
          set +e
          node --test --test-concurrency=1 tests/*.test.js > ci-test-output.txt 2>&1
          status=$?
          printf '%s\n' "$status" > ci-test-status.txt
          exit 0
      - name: Upload diagnostic output
        uses: actions/upload-artifact@v4
        with:
          name: ci-full-suite-output
          path: |
            ci-test-output.txt
            ci-test-status.txt
      - name: Preserve full-suite conclusion
        shell: bash
        run: test "$(cat ci-test-status.txt)" -eq 0
