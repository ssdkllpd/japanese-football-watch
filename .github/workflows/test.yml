name: Test

on:
  pull_request:

permissions:
  contents: read

jobs:
  api-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node --test tests/api-football-*.test.js
  app-backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node --test tests/app-v2-shell.test.js tests/backfill-merge-parity.test.js
  clubs-favorites:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node --test tests/clubs.test.js tests/favorites.test.js
  feyenoord-formation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node --test tests/feyenoord-cambuur-2026-08-23.test.js tests/formation-view.test.js
  rating-monaco-motherwell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node --test tests/jfw-rating-null.test.js tests/monaco-minamino-2026-08-23.test.js tests/motherwell-freiburg-rating-2026-08-23.test.js
