name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Diagnostic ABC
        continue-on-error: true
        run: >-
          node --test --test-concurrency=1
          tests/api-*.test.js tests/app-*.test.js tests/august-*.test.js
          tests/backfill-*.test.js tests/clubs.test.js tests/current-*.test.js
          tests/favorites.test.js tests/feyenoord-*.test.js tests/formation-*.test.js
          tests/jfw-*.test.js tests/monaco-*.test.js tests/motherwell-*.test.js
          tests/premier-*.test.js tests/provider-*.test.js tests/saito-*.test.js
          tests/sano-*.test.js tests/sato-*.test.js tests/snapshot-*.test.js
          tests/takai-*.test.js tests/transfer-*.test.js
      - name: Diagnostic ABD
        continue-on-error: true
        run: >-
          node --test --test-concurrency=1
          tests/api-*.test.js tests/app-*.test.js tests/august-*.test.js
          tests/backfill-*.test.js tests/clubs.test.js tests/current-*.test.js
          tests/favorites.test.js tests/feyenoord-*.test.js tests/formation-*.test.js
          tests/v2-*.test.js
      - name: Diagnostic ACD
        continue-on-error: true
        run: >-
          node --test --test-concurrency=1
          tests/api-*.test.js tests/app-*.test.js tests/august-*.test.js
          tests/jfw-*.test.js tests/monaco-*.test.js tests/motherwell-*.test.js
          tests/premier-*.test.js tests/provider-*.test.js tests/saito-*.test.js
          tests/sano-*.test.js tests/sato-*.test.js tests/snapshot-*.test.js
          tests/takai-*.test.js tests/transfer-*.test.js tests/v2-*.test.js
      - name: Diagnostic BCD
        continue-on-error: true
        run: >-
          node --test --test-concurrency=1
          tests/backfill-*.test.js tests/clubs.test.js tests/current-*.test.js
          tests/favorites.test.js tests/feyenoord-*.test.js tests/formation-*.test.js
          tests/jfw-*.test.js tests/monaco-*.test.js tests/motherwell-*.test.js
          tests/premier-*.test.js tests/provider-*.test.js tests/saito-*.test.js
          tests/sano-*.test.js tests/sato-*.test.js tests/snapshot-*.test.js
          tests/takai-*.test.js tests/transfer-*.test.js tests/v2-*.test.js
