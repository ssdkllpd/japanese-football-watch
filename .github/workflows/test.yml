name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check runtime scripts
        run: |
          node --check app-v2.js
          node --check backfill-merge.js
          node --check backfill-loader.js
          node --check v2-backfill-data.js
          node --check clubs.js
          node --check favorites.js
          node --check formation-view.js
          node --check jfw-rating.js
          node --check match-detail.js
          node --check theme.js
          node --check v2-preview.js
          node --check scripts/api-football/backfill-existing-results.js
          node --check scripts/api-football/client.js
          node --check scripts/api-football/field-inventory.js
          node --check scripts/api-football/schema-v2-mapper.js
          node --check scripts/api-football/smoke-test.js
          node --check scripts/v2/fixture-contract.js
          node --check scripts/v2/fetch-fixture-vertical-slice.js
          node --check scripts/v2/fetch-date-feed.js
          node --check scripts/v2/fetch-standings.js
          node --check scripts/v2/merge-date-index.js
          node --check worker/index.mjs
      - name: Diagnostic group A api-app-august
        continue-on-error: true
        run: node --test tests/api-*.test.js tests/app-*.test.js tests/august-*.test.js
      - name: Diagnostic group B merge-core-ui
        continue-on-error: true
        run: node --test tests/backfill-*.test.js tests/clubs.test.js tests/current-*.test.js tests/favorites.test.js tests/feyenoord-*.test.js tests/formation-*.test.js
      - name: Diagnostic group C ratings-snapshot-transfer
        continue-on-error: true
        run: node --test tests/jfw-*.test.js tests/monaco-*.test.js tests/motherwell-*.test.js tests/premier-*.test.js tests/provider-*.test.js tests/saito-*.test.js tests/sano-*.test.js tests/sato-*.test.js tests/snapshot-*.test.js tests/takai-*.test.js tests/transfer-*.test.js
      - name: Diagnostic group D v2
        continue-on-error: true
        run: node --test tests/v2-*.test.js
