name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest CP1 fix branch
        uses: actions/checkout@v4
        with:
          ref: fix/current-main-ci-20260827
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Capture latest CP1 full-suite result
        shell: bash
        run: |
          set +e
          node --test tests/*.test.js > cp1-test-output.txt 2>&1
          status=$?
          printf '%s\n' "$status" > cp1-test-status.txt
          exit 0
      - name: Upload latest CP1 diagnostic output
        uses: actions/upload-artifact@v4
        with:
          name: cp1-fix-test-output-latest
          path: |
            cp1-test-output.txt
            cp1-test-status.txt
      - name: Preserve test conclusion
        shell: bash
        run: test "$(cat cp1-test-status.txt)" -eq 0
