name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check runtime scripts
        run: |
          node --check app-v2.js
          node --check backfill-merge.js
          node --check backfill-loader.js
          node --check v2-backfill-data.js
          node --check clubs.js
          node --check favorites.js
          node --check formation-view.js
          node --check jfw-rating.js
          node --check match-detail.js
          node --check theme.js
          node --check v2-preview.js
          node --check scripts/api-football/backfill-existing-results.js
          node --check scripts/api-football/client.js
          node --check scripts/api-football/field-inventory.js
          node --check scripts/api-football/schema-v2-mapper.js
          node --check scripts/api-football/smoke-test.js
          node --check scripts/v2/fixture-contract.js
          node --check scripts/v2/fetch-fixture-vertical-slice.js
          node --check scripts/v2/fetch-date-feed.js
          node --check scripts/v2/fetch-standings.js
          node --check scripts/v2/merge-date-index.js
          node --check scripts/d1/import-date-index-coverage.mjs
          node --check scripts/d1/request-admin-ingest.mjs
          node --check scripts/d1/create-v2-admin-plan.js
          node --check scripts/v2/reconcile-fixture-revision.js
          node --check scripts/d1/render-admin-wrangler.mjs
          node --check shared/date-index-contract.mjs
          node --check shared/fixed-snapshot-contract.mjs
          node --check worker/index.mjs
          node --check admin-worker/index.mjs
          node --check admin-worker/date-index-coverage-ingest.mjs
          node --check admin-worker/migration-verify.mjs
          node --check admin-worker/fixture-ingest.mjs
          node --check admin-worker/fixed-snapshot-ingest.mjs
      - name: Run tests
        run: node --test tests/*.test.js
