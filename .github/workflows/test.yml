name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest CP1 fix branch
        uses: actions/checkout@v4
        with:
          ref: fix/current-main-ci-20260827
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inspect final correction ratings
        shell: bash
        run: |
          node - <<'NODE' > cp1-rating-diagnostic.json
          const fs = require('node:fs');
          const path = require('node:path');
          const vm = require('node:vm');
          const { mergeBackfillData } = require('./backfill-merge.js');
          const data = JSON.parse(fs.readFileSync('data.json', 'utf8'));
          const manifest = JSON.parse(fs.readFileSync('data/2026-27/backfill/index.json', 'utf8'));
          const fragments = manifest.fragments.map(name => JSON.parse(fs.readFileSync(path.join('data/2026-27/backfill', name), 'utf8')));
          const merged = mergeBackfillData(data, fragments, { season: '2026-27' });
          const window = { addEventListener() {} };
          const context = { window, document: {}, console, setTimeout() {} };
          vm.createContext(context);
          vm.runInContext(fs.readFileSync('jfw-rating.js', 'utf8'), context);
          const api = window.JFWRating;
          const ids = ['r-morita-stoke-hull-20260825', 'r-hatate-lask-celtic-20260825'];
          const output = {};
          for (const id of ids) {
            const r = merged.playerMatchStats.find(x => x.recordId === id);
            output[id] = {
              record: r,
              recomputed: r ? api.compute(r.ratingInputs, r.ratingPosition) : null
            };
          }
          console.log(JSON.stringify(output, null, 2));
          NODE
      - name: Upload rating diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: cp1-rating-diagnostic
          path: cp1-rating-diagnostic.json
