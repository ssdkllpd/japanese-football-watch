name: Test

on:
  pull_request:

permissions:
  contents: read

jobs:
  identities:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node --test --test-name-pattern='current season player identities' tests/current-data-integrity.test.js
  provenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node --test --test-name-pattern='current playerMatchStats preserve' tests/current-data-integrity.test.js
  aggregates:
