name: Test

on:
  pull_request:

permissions:
  contents: read

jobs:
  current-data-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/current-data-integrity.test.js

  current-rating-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/current-rating-integrity.test.js

  snapshot-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/snapshot-manifest-consistency.test.js

  recent-august-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/august-*.test.js

  remaining-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run remaining tests individually
        shell: bash
        run: |
          set -e
          for f in tests/*.test.js; do
            case "$f" in
              tests/current-data-integrity.test.js|tests/current-rating-integrity.test.js|tests/snapshot-manifest-consistency.test.js|tests/august-*.test.js) continue ;;
            esac
            node --test "$f"
          done
