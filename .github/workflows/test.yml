name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout CP1 fix branch
        uses: actions/checkout@v4
        with:
          ref: fix/current-main-ci-20260827
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Make rating input signature order-insensitive
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('backfill-merge.js')
          s = p.read_text(encoding='utf-8')
          old = """    function ratingInputsSignature(record) {\n      try { return JSON.stringify(record?.ratingInputs || {}); } catch { return ''; }\n    }"""
          new = """    function ratingInputsSignature(record) {\n      try {\n        const entries = Object.entries(record?.ratingInputs || {})\n          .sort(([left], [right]) => left.localeCompare(right))\n          .map(([field, input]) => [\n            field,\n            Object.entries(input || {}).sort(([left], [right]) => left.localeCompare(right))\n          ]);\n        return JSON.stringify(entries);\n      } catch {\n        return '';\n      }\n    }"""
          assert s.count(old) == 1, s.count(old)
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          node --check backfill-merge.js
          git diff --check
      - name: Verify full suite before push
        run: node --test tests/*.test.js
      - name: Commit verified merge fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backfill-merge.js
          git commit -m "Make rating input signatures order-insensitive"
          git push origin HEAD:fix/current-main-ci-20260827
