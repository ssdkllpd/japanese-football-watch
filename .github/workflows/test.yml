name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Upload fix source files
        uses: actions/upload-artifact@v4
        with:
          name: ci-fix-source-files
          path: |
            data/2026-27/backfill/latest-2026-08-26-3.json
            data/2026-27/backfill/latest-2026-08-26-4.json
            tests/august-26-postmatch-corrections.test.js
