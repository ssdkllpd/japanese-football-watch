name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check runtime scripts
        run: |
          node --check app-v2.js
          node --check backfill-merge.js
          node --check backfill-loader.js
          node --check v2-backfill-data.js
          node --check clubs.js
          node --check favorites.js
          node --check formation-view.js
          node --check jfw-rating.js
          node --check match-detail.js
          node --check theme.js
          node --check v2-preview.js
          node --check scripts/api-football/backfill-existing-results.js
          node --check scripts/api-football/client.js
          node --check scripts/api-football/field-inventory.js
          node --check scripts/api-football/schema-v2-mapper.js
          node --check scripts/api-football/smoke-test.js
          node --check scripts/v2/fixture-contract.js
          node --check scripts/v2/fetch-fixture-vertical-slice.js
          node --check scripts/v2/fetch-date-feed.js
          node --check scripts/v2/fetch-standings.js
          node --check scripts/v2/merge-date-index.js
          node --check worker/index.mjs
      - name: Test v2 backfill adapter
        run: node --test tests/v2-backfill-data.test.js
      - name: Test v2 shell wiring
        run: node --test tests/app-v2-shell.test.js
      - name: Parity - pure function
        continue-on-error: true
        run: node --test --test-name-pattern="pure function" tests/backfill-merge-parity.test.js
      - name: Parity - current baseline
        continue-on-error: true
        run: node --test --test-name-pattern="current raw data expands" tests/backfill-merge-parity.test.js
      - name: Parity - golden legacy output
        continue-on-error: true
        run: node --test --test-name-pattern="pinned 49c70c3" tests/backfill-merge-parity.test.js
      - name: Parity - replay drift
        continue-on-error: true
        run: node --test --test-name-pattern="known replay drift" tests/backfill-merge-parity.test.js
      - name: Parity - source overrides
        continue-on-error: true
        run: node --test --test-name-pattern="pinned source id overrides" tests/backfill-merge-parity.test.js
      - name: Parity - CommonJS isolation
        continue-on-error: true
        run: node --test --test-name-pattern="CommonJS" tests/backfill-merge-parity.test.js
      - name: Parity - legacy current season
        continue-on-error: true
        run: node --test --test-name-pattern="legacy loader" tests/backfill-merge-parity.test.js
      - name: Test backfill merge parity
        run: node --test tests/backfill-merge-parity.test.js
      - name: Run full test suite
        run: node --test tests/*.test.js