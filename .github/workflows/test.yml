name: Test

on:
  pull_request:

permissions:
  contents: read

jobs:
  current-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node --test tests/current-data-integrity.test.js
  current-rating:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node --test tests/current-rating-integrity.test.js
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node --test tests/snapshot-manifest-consistency.test.js
  aug23:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node --test tests/august-23-rating-refinements.test.js
  aug24:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node --test tests/august-24-*.test.js
  aug25:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node --test tests/august-25-*.test.js
  nonaug-a-m:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - shell: bash
        run: |
          set -e
          for f in tests/*.test.js; do
            b=$(basename "$f")
            case "$b" in august-*|current-*|snapshot-*) continue;; esac
            first=$(printf '%s' "$b" | cut -c1)
            case "$first" in [a-m]) node --test "$f";; esac
          done
  nonaug-n-z:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - shell: bash
        run: |
          set -e
          for f in tests/*.test.js; do
            b=$(basename "$f")
            case "$b" in august-*|current-*|snapshot-*) continue;; esac
            first=$(printf '%s' "$b" | cut -c1)
            case "$first" in [n-z]) node --test "$f";; esac
          done
