name: Test

on:
  pull_request:

permissions:
  contents: read

jobs:
  identities:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node --test --test-name-pattern='current season player identities' tests/current-data-integrity.test.js
  provenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node --test --test-name-pattern='current playerMatchStats preserve' tests/current-data-integrity.test.js
  aggregates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node --test --test-name-pattern='verified match G/A' tests/current-data-integrity.test.js
  goto-goal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node --test --test-name-pattern='後藤啓介' tests/current-data-integrity.test.js
  j1-scope:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node --test --test-name-pattern='J1 is not' tests/current-data-integrity.test.js
  aug23:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node --test tests/august-23-rating-refinements.test.js
  aug24:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node --test tests/august-24-*.test.js
  aug25:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node --test tests/august-25-*.test.js
