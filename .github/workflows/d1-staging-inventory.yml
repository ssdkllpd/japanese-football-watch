name: D1 Staging Inventory (read only)

on:
  workflow_dispatch:
  push:
    branches: [feat/d1-r2-staging-migration]
    paths:
      - .github/workflows/d1-staging-inventory.yml
      - config/d1-targets.json
      - scripts/d1/render-admin-wrangler.mjs
      - scripts/d1/verify-d1-target.mjs

permissions:
  contents: read

concurrency:
  group: d1-staging-inventory
  cancel-in-progress: false

jobs:
  inventory:
    runs-on: ubuntu-latest
    environment: d1-staging
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Resolve exact reviewed staging target
        env:
          ADMIN_WORKER_NAME: ${{ vars.ADMIN_WORKER_NAME }}
          D1_DATABASE_NAME: ${{ vars.D1_DATABASE_NAME }}
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          ADMIN_INGEST_URL: ${{ vars.ADMIN_INGEST_URL }}
        run: |
          set -euo pipefail
          node scripts/d1/verify-d1-target.mjs --manifest config/d1-targets.json --target staging
          test "$D1_DATABASE_NAME" = 'jfw-football-staging'
          echo "D1_DATABASE_NAME=$D1_DATABASE_NAME" >> "$GITHUB_ENV"

      - name: Render local-only Wrangler binding configuration
        env:
          ADMIN_WORKER_NAME: ${{ vars.ADMIN_WORKER_NAME }}
          D1_DATABASE_NAME: ${{ vars.D1_DATABASE_NAME }}
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
        run: node scripts/d1/render-admin-wrangler.mjs --output .tmp/d1-inventory-wrangler.toml

      - name: Read D1 metadata and current bookmark
        run: |
          set -euo pipefail
          mkdir -p .tmp/d1-inventory
          npx --yes wrangler@4 d1 info "$D1_DATABASE_NAME" --json \
            > .tmp/d1-inventory/info.json
          npx --yes wrangler@4 d1 time-travel info "$D1_DATABASE_NAME" --json \
            > .tmp/d1-inventory/bookmark.json

      - name: Read schema and migration inventory
        run: |
          set -euo pipefail
          npx --yes wrangler@4 d1 execute "$D1_DATABASE_NAME" --remote --json \
            --config .tmp/d1-inventory-wrangler.toml \
            --command "SELECT name, type FROM sqlite_master WHERE type IN ('table','index','trigger') ORDER BY type, name" \
            > .tmp/d1-inventory/schema.json
          npx --yes wrangler@4 d1 execute "$D1_DATABASE_NAME" --remote --json \
            --config .tmp/d1-inventory-wrangler.toml \
            --command "SELECT id, name, applied_at FROM d1_migrations ORDER BY id" \
            > .tmp/d1-inventory/migrations.json

      - name: Read scoped major-league counts and integrity signals
        run: |
          set -euo pipefail
          scopes="'af:season:39:2026','af:season:40:2026','af:season:61:2026','af:season:78:2026','af:season:88:2026','af:season:94:2026','af:season:135:2026','af:season:140:2026','af:season:144:2026','af:season:179:2026'"
          npx --yes wrangler@4 d1 execute "$D1_DATABASE_NAME" --remote --json \
            --config .tmp/d1-inventory-wrangler.toml \
            --command "SELECT (SELECT COUNT(*) FROM competition_seasons WHERE canonical_id IN ($scopes)) AS competitionSeasons, (SELECT COUNT(*) FROM competition_season_teams membership JOIN competition_seasons season ON season.id=membership.competition_season_id WHERE season.canonical_id IN ($scopes)) AS seasonTeamRows, (SELECT COUNT(*) FROM fixtures fixture JOIN competition_seasons season ON season.id=fixture.competition_season_id WHERE season.canonical_id IN ($scopes)) AS fixtures, (SELECT COUNT(*) FROM fixtures fixture JOIN competition_seasons season ON season.id=fixture.competition_season_id JOIN fixture_revisions revision ON revision.id=fixture.published_revision AND revision.fixture_id=fixture.id WHERE season.canonical_id IN ($scopes) AND revision.lifecycle_state='published') AS publishedFixtureDetails, (SELECT COUNT(*) FROM standings_publications publication JOIN competition_seasons season ON season.id=publication.competition_season_id WHERE season.canonical_id IN ($scopes)) AS standingsPublications, (SELECT COUNT(*) FROM standings_rows standing_row JOIN standings_publications publication ON publication.snapshot_id=standing_row.snapshot_id JOIN competition_seasons season ON season.id=publication.competition_season_id WHERE season.canonical_id IN ($scopes)) AS standingsRows, (SELECT COUNT(*) FROM date_index_coverages) AS allDateCoverages, (SELECT COUNT(*) FROM competition_date_index_coverages) AS allCompetitionDateCoverages" \
            > .tmp/d1-inventory/counts.json
          npx --yes wrangler@4 d1 execute "$D1_DATABASE_NAME" --remote --json \
            --config .tmp/d1-inventory-wrangler.toml \
            --command "SELECT fixture.canonical_id, season.canonical_id AS season_id, fixture.date_jst, season.starts_on, season.ends_on FROM fixtures fixture JOIN competition_seasons season ON season.id=fixture.competition_season_id WHERE season.canonical_id IN ($scopes) AND (fixture.date_jst < date(season.starts_on,'-1 day') OR fixture.date_jst > date(season.ends_on,'+1 day')) LIMIT 100" \
            > .tmp/d1-inventory/date-violations.json
          npx --yes wrangler@4 d1 execute "$D1_DATABASE_NAME" --remote --json \
            --config .tmp/d1-inventory-wrangler.toml \
            --command "PRAGMA foreign_key_check" \
            > .tmp/d1-inventory/foreign-key-check.json

      - name: Build bounded inventory summary
        run: |
          set -euo pipefail
          jq -n \
            --slurpfile counts .tmp/d1-inventory/counts.json \
            --slurpfile migrations .tmp/d1-inventory/migrations.json \
            --slurpfile dates .tmp/d1-inventory/date-violations.json \
            --slurpfile foreignKeys .tmp/d1-inventory/foreign-key-check.json \
            '{schemaVersion:"jfw-d1-staging-inventory/1", readOnly:true, target:"jfw-football-staging", counts:($counts[0][0].results[0] // null), migrations:($migrations[0][0].results // []), dateViolationCount:(($dates[0][0].results // [])|length), foreignKeyViolationCount:(($foreignKeys[0][0].results // [])|length), publicFlagsChanged:false}' \
            > .tmp/d1-inventory/summary.json
          jq . .tmp/d1-inventory/summary.json

      - name: Upload read-only inventory evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d1-staging-inventory-${{ github.sha }}
          path: .tmp/d1-inventory
          if-no-files-found: warn
          retention-days: 14
