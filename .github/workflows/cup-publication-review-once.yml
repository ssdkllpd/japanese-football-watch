name: Review stored cup publication failures once
on:
  push:
    branches: [main]
    paths: [.github/workflows/cup-publication-review-once.yml]
permissions:
  contents: read
concurrency:
  group: d1-staging-write
  queue: max
  cancel-in-progress: false
jobs:
  review:
    runs-on: ubuntu-latest
    environment: d1-staging
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_NAME: ${{ vars.D1_DATABASE_NAME }}
      D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
      ADMIN_WORKER_NAME: ${{ vars.ADMIN_WORKER_NAME }}
      D1_ADMIN_PUBLISH_ENABLED: ${{ vars.D1_ADMIN_PUBLISH_ENABLED }}
      R2_BUCKET: ${{ vars.R2_BUCKET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify reviewed read target
        run: |
          test "$D1_ADMIN_PUBLISH_ENABLED" = true
          test "$R2_BUCKET" = jfw-football-data
          node scripts/d1/verify-d1-target.mjs --manifest config/d1-targets.json --target staging
          mkdir -p .tmp/cup-review
          npm install --prefix .tmp/cup-tools --ignore-scripts --no-audit --no-fund wrangler@4.147.0
      - name: Read the four already fetched FA Cup objects without provider requests
        run: |
          for id in 1646584 1646586 1646587 1646593; do
            node .tmp/cup-tools/node_modules/wrangler/bin/wrangler.js r2 object get "$R2_BUCKET/football/v2/competitions/af:competition:45/seasons/af:season:45:2026/fixtures/af:fixture:$id.json" --file ".tmp/cup-review/$id.json" --remote
          done
      - name: Read only the existing identities referenced by those four fixtures
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {remoteDatabase} from './scripts/live/remote-d1.mjs';
          const db=remoteDatabase({account:process.env.CLOUDFLARE_ACCOUNT_ID,token:process.env.CLOUDFLARE_API_TOKEN,databaseId:process.env.D1_DATABASE_ID,readOnly:true});
          const ids=new Set();
          const scan=value=>{if(typeof value==='string'&&/^af:(team|player|coach|venue):[0-9]+$/.test(value))ids.add(value);else if(Array.isArray(value))value.forEach(scan);else if(value&&typeof value==='object')Object.values(value).forEach(scan);};
          for(const id of [1646584,1646586,1646587,1646593])scan(JSON.parse(fs.readFileSync(`.tmp/cup-review/${id}.json`,'utf8')));
          const rows={};
          for(const table of ['teams','players','coaches','venues'])rows[table]=(await db.prepare(`SELECT * FROM ${table} WHERE canonical_id IN (SELECT value FROM json_each(?))`).bind(JSON.stringify([...ids])).all()).results;
          rows.provider_sources=(await db.prepare('SELECT * FROM provider_sources').all()).results;
          rows.product_seasons=(await db.prepare('SELECT * FROM product_seasons').all()).results;
          rows.competitions=(await db.prepare("SELECT * FROM competitions WHERE canonical_id='af:competition:45'").all()).results;
          rows.competition_seasons=(await db.prepare("SELECT * FROM competition_seasons WHERE canonical_id='af:season:45:2026'").all()).results;
          fs.writeFileSync('.tmp/cup-review/identities.json',JSON.stringify(rows));
          console.log(JSON.stringify({readOnly:true,counts:Object.fromEntries(Object.entries(rows).map(([k,v])=>[k,v.length]))}));
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cup-publication-review-${{ github.run_id }}
          path: .tmp/cup-review/*.json
          retention-days: 14
