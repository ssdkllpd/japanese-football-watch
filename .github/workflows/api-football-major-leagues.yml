name: API-Football Major Leagues Snapshot

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - config/d1-major-leagues-2026.json
      - scripts/v2/fetch-major-league-season-snapshot.js
      - .github/workflows/api-football-major-leagues.yml

permissions:
  contents: read

concurrency:
  group: api-football-major-leagues-2026
  cancel-in-progress: false

jobs:
  collect-and-archive:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: d1-staging
    env:
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ADMIN_WORKER_NAME: ${{ vars.ADMIN_WORKER_NAME }}
      D1_DATABASE_NAME: ${{ vars.D1_DATABASE_NAME }}
      D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
      R2_BUCKET: ${{ vars.R2_BUCKET }}
      ADMIN_INGEST_URL: ${{ vars.ADMIN_INGEST_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate protected configuration
        run: |
          test -n "$API_FOOTBALL_KEY" || { echo 'API_FOOTBALL_KEY is required'; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'CLOUDFLARE_API_TOKEN is required'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'CLOUDFLARE_ACCOUNT_ID is required'; exit 1; }
          test -n "$R2_BUCKET" || { echo 'R2_BUCKET is required'; exit 1; }
          node scripts/d1/verify-d1-target.mjs --manifest config/d1-targets.json --target staging

      - name: Collect all available 2026 season data for the ten major leagues
        run: >-
          node scripts/v2/fetch-major-league-season-snapshot.js
          --config config/d1-major-leagues-2026.json
          --out .tmp/api-football-major-leagues
          --reserve 50
          --interval 300

      - name: Build immutable archive and latest pointer
        shell: bash
        run: |
          mkdir -p .tmp/api-football-major-leagues-publish
          tar -C .tmp/api-football-major-leagues -czf .tmp/api-football-major-leagues-publish/snapshot.tar.gz .
          archive_sha=$(sha256sum .tmp/api-football-major-leagues-publish/snapshot.tar.gz | cut -d' ' -f1)
          archive_key=$(jq -r '.r2.archiveKey' .tmp/api-football-major-leagues/manifest.json)
          manifest_key=$(jq -r '.r2.manifestKey' .tmp/api-football-major-leagues/manifest.json)
          latest_key=$(jq -r '.r2.latestKey' .tmp/api-football-major-leagues/manifest.json)
          jq --arg archiveSha256 "$archive_sha" --arg archiveKey "$archive_key" \
            '. + {archiveSha256: $archiveSha256, archiveKey: $archiveKey}' \
            .tmp/api-football-major-leagues/manifest.json \
            > .tmp/api-football-major-leagues-publish/latest.json
          cp .tmp/api-football-major-leagues/manifest.json .tmp/api-football-major-leagues-publish/manifest.json
          {
            echo "archive_key=$archive_key"
            echo "manifest_key=$manifest_key"
            echo "latest_key=$latest_key"
          } >> "$GITHUB_ENV"

      - name: Archive snapshot in R2
        run: |
          npx --yes wrangler@4 r2 object put "$R2_BUCKET/$archive_key" \
            --file .tmp/api-football-major-leagues-publish/snapshot.tar.gz \
            --content-type application/gzip --remote
          npx --yes wrangler@4 r2 object put "$R2_BUCKET/$manifest_key" \
            --file .tmp/api-football-major-leagues-publish/manifest.json \
            --content-type application/json --remote
          npx --yes wrangler@4 r2 object put "$R2_BUCKET/$latest_key" \
            --file .tmp/api-football-major-leagues-publish/latest.json \
            --content-type application/json --remote

      - name: Verify archived bytes
        run: |
          npx --yes wrangler@4 r2 object get "$R2_BUCKET/$archive_key" \
            --file .tmp/api-football-major-leagues-publish/roundtrip.tar.gz --remote
          test "$(sha256sum .tmp/api-football-major-leagues-publish/roundtrip.tar.gz | cut -d' ' -f1)" \
            = "$(sha256sum .tmp/api-football-major-leagues-publish/snapshot.tar.gz | cut -d' ' -f1)"

      - name: Print bounded collection summary
        run: jq '{complete, targetCount, totals, quota, r2}' .tmp/api-football-major-leagues/manifest.json

      - name: Upload collection evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-football-major-leagues-${{ github.sha }}
          path: |
            .tmp/api-football-major-leagues/manifest.json
            .tmp/api-football-major-leagues-publish/latest.json
          if-no-files-found: warn
          retention-days: 30
