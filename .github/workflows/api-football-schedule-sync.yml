name: API-Football Schedule Sync

on:
  schedule:
    - cron: '37 1 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: Inspect all ten seasons without writes, or publish verified changes
        required: true
        default: preview
        type: choice
        options: [preview, execute]
      confirmation:
        description: For execute, enter RUN SCHEDULE SYNC
        required: false
        type: string

permissions:
  contents: read

jobs:
  provision:
    if: github.event_name == 'schedule' && vars.API_FOOTBALL_SCHEDULE_SYNC_ENABLED == 'true' || github.event_name == 'workflow_dispatch' && inputs.mode == 'execute' && inputs.confirmation == 'RUN SCHEDULE SYNC'
    uses: ./.github/workflows/d1-staging-provision.yml
    secrets: inherit

  synchronize:
    needs: provision
    if: always() && (needs.provision.result == 'success' || github.event_name == 'workflow_dispatch' && inputs.mode == 'preview') && (github.event_name != 'schedule' || vars.API_FOOTBALL_SCHEDULE_SYNC_ENABLED == 'true')
    concurrency:
      group: d1-staging-write
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 50
    environment: d1-staging
    env:
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_NAME: ${{ vars.D1_DATABASE_NAME }}
      D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
      ADMIN_WORKER_NAME: ${{ vars.ADMIN_WORKER_NAME }}
      ADMIN_INGEST_URL: ${{ vars.ADMIN_INGEST_URL }}
      ADMIN_INGEST_TOKEN: ${{ secrets.ADMIN_INGEST_TOKEN }}
      D1_ADMIN_PUBLISH_ENABLED: ${{ vars.D1_ADMIN_PUBLISH_ENABLED }}
      R2_BUCKET: ${{ vars.R2_BUCKET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate scope, credentials, and write gate
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_MODE: ${{ inputs.mode }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          test -n "$API_FOOTBALL_KEY" && test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID" && test -n "$ADMIN_INGEST_URL"
          node scripts/d1/verify-d1-target.mjs --manifest config/d1-targets.json --target staging
          if [ "$EVENT_NAME" = schedule ] || [ "$REQUESTED_MODE" = execute ]; then
            test "$D1_ADMIN_PUBLISH_ENABLED" = true
            test -n "$ADMIN_INGEST_TOKEN"
            if [ "$EVENT_NAME" = workflow_dispatch ]; then test "$CONFIRMATION" = 'RUN SCHEDULE SYNC'; fi
          fi
      - name: Guard monthly D1 writes and repair an interrupted publication
        if: github.event_name == 'schedule' || inputs.mode == 'execute'
        run: |
          mkdir -p .tmp/schedule-sync
          node scripts/d1/check-paid-backfill-capacity.mjs --out .tmp/schedule-sync/usage.json
          node scripts/d1/execute-fixture-schedule-plan.mjs repair
      - name: Read exact stored season fixture inventory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .tmp/schedule-sync
          node scripts/d1/render-admin-wrangler.mjs --output .tmp/schedule-sync/wrangler.toml
          npx --yes wrangler@4 d1 execute "$D1_DATABASE_NAME" --remote --json \
            --config .tmp/schedule-sync/wrangler.toml \
            --command "SELECT fixture.canonical_id AS fixture_id, competition.canonical_id AS competition_id, season.canonical_id AS season_id, fixture.kickoff_utc, fixture.status_short, fixture.published_revision, COUNT(*) OVER () AS total FROM fixtures fixture JOIN competition_seasons season ON season.id=fixture.competition_season_id JOIN competitions competition ON competition.id=season.competition_id WHERE season.canonical_id IN ('af:season:39:2026','af:season:40:2026','af:season:61:2026','af:season:78:2026','af:season:88:2026','af:season:94:2026','af:season:135:2026','af:season:140:2026','af:season:144:2026','af:season:179:2026') ORDER BY fixture.canonical_id" \
            > .tmp/schedule-sync/inventory.json
      - name: Compare all ten provider seasons to stored schedule
        run: node scripts/v2/plan-fixture-schedule-sync.js .tmp/schedule-sync/inventory.json .tmp/schedule-sync/plan.json
      - name: Publish changed unpublished schedules and repair date indexes
        if: github.event_name == 'schedule' || inputs.mode == 'execute'
        run: node scripts/d1/execute-fixture-schedule-plan.mjs execute .tmp/schedule-sync/plan.json
      - name: Upload schedule evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: schedule-sync-${{ github.run_id }}
          path: |
            .tmp/schedule-sync/plan.json
            .tmp/schedule-sync/usage.json
          if-no-files-found: warn
          retention-days: 14
