name: Apply runtime hardening review
on:
  pull_request:
    types: [opened]
permissions:
  contents: write
jobs:
  harden:
    if: github.head_ref == 'fix/runtime-hardening-2026-08-21'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/runtime-hardening-2026-08-21
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply reviewed migration
        run: python scripts/runtime-hardening-migration.py
      - name: Update synthetic transfer harness for explicit registry
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tests/transfer-model.test.js')
          s = p.read_text()
          old = """    fetch: async url => {\n      if (String(url).includes('index.json')) return { ok: true, json: async () => ({ fragments: fragments.map((_, i) => `${i}.json`) }) };\n"""
          new = """    fetch: async url => {\n      if (String(url).includes('config/player-registry.json')) return {\n        ok: true,\n        json: async () => ({ players: [{ playerId: player.playerId || 'jp-synthetic-player', name: player.name, aliases: [], providerIds: player.providerIds || {} }] })\n      };\n      if (String(url).includes('index.json')) return { ok: true, json: async () => ({ fragments: fragments.map((_, i) => `${i}.json`) }) };\n"""
          if old not in s:
              raise SystemExit('transfer-model fetch harness marker not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Run full test suite
        run: node --test tests/*.test.js
      - name: Validate compaction plan
        run: node scripts/compact-season.js --season 2026-27 --dry-run
      - name: Commit hardened implementation
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -- \
            backfill-loader.js \
            scripts/api-football/backfill-existing-results.js \
            scripts/shared/runtime-data-loader.js \
            scripts/shared/runtime-data-loader-cli.js \
            scripts/compact-season.js \
            config/player-registry.json \
            state/workflow_policy.json \
            tests/current-data-integrity.test.js \
            tests/transfer-model.test.js \
            tests/backfill-fail-closed.test.js \
            data/2026-27/backfill/latest-2026-08-20.json
          git diff --cached --quiet || git commit -m "Harden runtime data identity and overlay loading"
          git push origin HEAD:fix/runtime-hardening-2026-08-21
