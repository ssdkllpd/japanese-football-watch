name: Inspect Cloudflare Connection (read only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: d1-staging
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inspect public Worker configuration without changing resources
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/v2/inspect-cloudflare-connection.mjs
      - name: Upload filtered connection report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-connection-report
          path: .tmp/cloudflare-connection/report.json
          if-no-files-found: warn
          retention-days: 7
