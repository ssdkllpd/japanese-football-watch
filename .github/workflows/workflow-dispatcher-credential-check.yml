name: Inspect Workflow Dispatch Credential

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/workflow-dispatcher-credential-check.yml'
      - 'scripts/v2/check-dispatch-credential.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-secret:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inspect repository credential without exposing its value
        env:
          WORKFLOW_DISPATCH_TOKEN: ${{ secrets.WORKFLOW_DISPATCH_TOKEN }}
          CREDENTIAL_SCOPE: repository
        run: node scripts/v2/check-dispatch-credential.mjs
  environment-secret:
    runs-on: ubuntu-latest
    environment: d1-staging
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inspect effective environment credential without exposing its value
        env:
          WORKFLOW_DISPATCH_TOKEN: ${{ secrets.WORKFLOW_DISPATCH_TOKEN }}
          CREDENTIAL_SCOPE: d1-staging
        run: node scripts/v2/check-dispatch-credential.mjs
