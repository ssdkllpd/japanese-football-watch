<!doctype html>
<html lang="ja" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101214">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="stylesheet" href="app-v2.css?v=20261018-player-matches">
<link rel="stylesheet" href="app-v2-league.css?v=20261021-standings">
<link rel="stylesheet" href="app-v2-wireframe.css?v=20261027-japanese-clubs">
<title>Football Companion</title>
</head>
<body>
<div class="app-shell">
  <aside class="desktop-rail" aria-label="メインナビゲーション">
    <div class="brand-mark" aria-label="Football Companion">FC</div>
    <button class="rail-item is-active" data-page="matches" type="button"><span>試合</span></button>
    <button class="rail-item" data-page="leagues" type="button"><span>リーグ</span></button>
    <button class="rail-item" data-page="following" type="button"><span>フォロー中</span></button>
    <button class="rail-item" data-page="japanese" type="button"><span>選手一覧</span></button>
    <button class="rail-item" data-page="more" type="button"><span>その他</span></button>
  </aside>

  <div class="app-column">
    <header class="app-bar">
      <div>
        <div class="eyebrow" id="pageEyebrow">Football Companion</div>
        <h1 id="pageTitle">試合</h1>
      </div>
      <div class="app-actions">
        <span id="dataMode" class="data-mode">準備中</span>
        <button id="searchButton" class="icon-button" type="button" aria-label="検索を開く">検索</button>
        <button id="themeButton" class="icon-button" type="button" aria-label="テーマ切替">テーマ</button>
      </div>
    </header>

    <main id="appMain" class="app-main" aria-live="polite"></main>
  </div>

  <nav class="bottom-nav" aria-label="メインナビゲーション">
    <button class="nav-item is-active" data-page="matches" type="button"><span>試合</span></button>
    <button class="nav-item" data-page="leagues" type="button"><span>リーグ</span></button>
    <button class="nav-item" data-page="following" type="button"><span>フォロー中</span></button>
    <button class="nav-item" data-page="japanese" type="button"><span>選手一覧</span></button>
    <button class="nav-item" data-page="more" type="button"><span>その他</span></button>
  </nav>
</div>
<script src="formation-view.js"></script>
<script src="backfill-merge.js"></script>
<script src="v2-backfill-data.js"></script>
<script src="app-v2-config.js?v=20261027-club-search"></script>
<script src="app-v2-data.js?v=20261027-japanese-clubs"></script>
<script src="tracked-player-stats.js?v=20261017"></script>
<script src="tracked-player-provider-ids.js?v=20261017"></script>
<script src="all-player-stats.js?v=20261018-club-names"></script>
<script src="app-v2-history.js"></script>
<script src="app-v2-router.js"></script>
<script src="player-name-data.js?v=20260908"></script>
<script src="player-names.js?v=20261015"></script>
<script src="app-v2.js?v=20261027-japanese-clubs"></script>
</body>
</html>
