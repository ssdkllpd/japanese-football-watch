<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0b1020" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="icon.svg" type="image/svg+xml" />
<title>海外日本人ウォッチ 2026-27</title>
<style>
:root{--bg:#080c18;--panel:#11182a;--panel2:#182238;--text:#f4f7fb;--muted:#95a3b8;--accent:#5eead4;--accent2:#60a5fa;--line:#27334a;--warn:#fbbf24}
*{box-sizing:border-box} body{margin:0;background:linear-gradient(180deg,#080c18,#0d1322 55%,#080c18);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}
.wrap{max-width:920px;margin:auto;padding:18px 14px 80px}.hero{padding:12px 4px 8px}.hero h1{font-size:24px;margin:0 0 5px}.muted{color:var(--muted);font-size:12px}.sticky{position:sticky;top:0;z-index:20;background:rgba(8,12,24,.92);backdrop-filter:blur(10px);padding:10px 0;border-bottom:1px solid var(--line)}
.tabs{display:flex;gap:8px;overflow:auto;padding:0 2px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}.tab{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:999px;padding:9px 12px;white-space:nowrap;font-size:13px}.tab.active{background:var(--accent);color:#06211d;border-color:var(--accent);font-weight:700}
.section{margin-top:22px}.section h2{font-size:18px;margin:0 0 10px}.card{background:linear-gradient(180deg,var(--panel),#0f1627);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px;box-shadow:0 8px 24px rgba(0,0,0,.16)}
.rankline{display:flex;align-items:flex-start;gap:12px}.rank{width:34px;height:34px;border-radius:10px;background:var(--panel2);display:grid;place-items:center;font-weight:800;color:var(--accent)}.grow{flex:1;min-width:0}.name{font-size:17px;font-weight:800}.club{font-size:13px;color:var(--muted);margin-top:2px}.pill{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:4px 8px;font-size:11px;margin:7px 5px 0 0;color:#cbd5e1}.stars{color:var(--warn);letter-spacing:1px}.latest{margin-top:9px;font-size:13px;line-height:1.45}.match-title{font-size:16px;font-weight:800;line-height:1.35}.match-meta{font-size:12px;color:var(--muted);margin-top:6px}.reason{font-size:13px;margin-top:8px;line-height:1.45}.badge{float:right;font-size:12px;font-weight:800;padding:5px 8px;background:rgba(94,234,212,.12);color:var(--accent);border:1px solid rgba(94,234,212,.3);border-radius:9px}.search{width:100%;margin:10px 0 0;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;color:var(--text);outline:none}.search:focus{border-color:var(--accent2)}
.grid{display:grid;grid-template-columns:1fr;gap:10px}.empty{padding:18px;color:var(--muted);text-align:center}.footer{margin-top:28px;font-size:11px;color:var(--muted);line-height:1.6}.top10 .card{padding:12px}.summary-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}.summary-box{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center}.summary-num{font-size:24px;font-weight:900}.summary-label{font-size:11px;color:var(--muted);margin-top:2px}.result-W{color:#86efac}.result-D{color:#fde68a}.result-L{color:#fca5a5}.ga-line{display:flex;gap:8px;align-items:center;justify-content:space-between}.ga-result{font-weight:900;font-size:13px}.top10 .name{font-size:15px}
@media(min-width:720px){.grid{grid-template-columns:1fr 1fr}.hero h1{font-size:30px}.wrap{padding-top:28px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <h1>海外日本人ウォッチ 2026-27</h1>
    <div id="updated" class="muted">読み込み中…</div>
  </div>
  <div class="sticky">
    <div class="tabs" id="tabs"></div>
    <input id="search" class="search" placeholder="選手・クラブ・試合を検索" />
  </div>
  <section class="section" id="topMatchesSection"><h2>今見るべき試合 TOP5</h2><div id="topMatches" class="grid"></div></section>
  <section class="section top10" id="top10Section"><h2>全リーグ横断 TOP10</h2><div id="top10" class="grid"></div></section>
  <section class="section" id="gaSection"><h2>日本人G/A試合のチーム成績</h2><div id="gaSummary" class="summary-row"></div><div id="gaResults" class="grid"></div></section>
  <section class="section"><h2 id="leagueTitle">リーグ別ランキング</h2><div id="players"></div></section>
  <section class="section"><h2>直近の試合ログ</h2><div id="matches"></div></section>
  <div class="footer">※ データはこのサイトの <code>data.json</code> を更新すると反映されます。GitHub Pagesでは同じURLのまま最新版へ更新できます。</div>
</div>
<script>
let DATA=null; let current='すべて';
const leagueOrder=['すべて','プレミアリーグ','チャンピオンシップ','ブンデスリーガ','ラ・リーガ','エールディヴィジ','ベルギー','ポルトガル','スコットランド'];
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
const stars=n=>'★'.repeat(n)+'☆'.repeat(Math.max(0,5-n));
function playerCard(p){return `<div class="card"><div class="rankline"><div class="rank">${esc(p.rank)}</div><div class="grow"><div class="name">${esc(p.name)}</div><div class="club">${esc(p.club)} ・ ${esc(p.pos)}</div><span class="pill">${esc(p.status)}</span><span class="pill stars">${stars(p.rating)}</span><div class="latest">${esc(p.latest)}</div><div class="muted" style="margin-top:7px">更新 ${esc(p.updated)}</div></div></div></div>`}
function matchCard(m,withRank=false){return `<div class="card">${withRank?`<span class="badge">#${esc(m.rank)} ${esc(m.rating)}</span>`:''}<div class="match-title">${esc(m.match)}</div><div class="match-meta">${esc(m.league)}${m.ko?' ・ '+esc(m.ko)+' JST':''}</div><div class="reason"><b>${esc(m.players)}</b><br>${esc(m.reason||m.note||'')}<br><span class="muted">視聴: ${esc(m.watch||'確認中')}</span></div></div>`}
function gaCard(x){return `<div class="card"><div class="ga-line"><div><div class="name">${esc(x.player)} <span class="pill">${esc(x.contribution)}</span></div><div class="club">${esc(x.club)} ・ ${esc(x.league)}</div></div><div class="ga-result result-${esc(x.result)}">${esc(x.resultLabel)}</div></div><div class="latest">${esc(x.match)}</div><div class="muted" style="margin-top:7px">${esc(x.ko)} JST</div></div>`}
function renderGA(){const rows=DATA.gaResults||[]; const counts={W:0,D:0,L:0}; rows.forEach(x=>counts[x.result]=(counts[x.result]||0)+1); document.getElementById('gaSummary').innerHTML=`<div class="summary-box"><div class="summary-num result-W">${counts.W}</div><div class="summary-label">勝</div></div><div class="summary-box"><div class="summary-num result-D">${counts.D}</div><div class="summary-label">分</div></div><div class="summary-box"><div class="summary-num result-L">${counts.L}</div><div class="summary-label">敗</div></div>`; document.getElementById('gaResults').innerHTML=rows.sort((a,b)=>b.ko.localeCompare(a.ko)).map(gaCard).join('')||'<div class="empty">G/A記録なし</div>'; }
function renderTabs(){const existing=new Set(DATA.players.map(p=>p.league));document.getElementById('tabs').innerHTML=leagueOrder.filter(x=>x==='すべて'||existing.has(x)).map(x=>`<button class="tab ${x===current?'active':''}" data-league="${esc(x)}">${esc(x)}</button>`).join('');document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{current=b.dataset.league;render();});}
function render(){renderTabs(); const q=document.getElementById('search').value.trim().toLowerCase(); const inLeague=x=>current==='すべて'||x.league===current; const hit=x=>!q||JSON.stringify(x).toLowerCase().includes(q); const ps=DATA.players.filter(p=>inLeague(p)&&hit(p)).sort((a,b)=>a.rank-b.rank); document.getElementById('leagueTitle').textContent=current==='すべて'?'リーグ別ランキング':'🇯🇵 '+current+' 注目度ランキング'; document.getElementById('players').innerHTML=ps.length?ps.map(playerCard).join(''):'<div class="empty">該当なし</div>'; const ms=DATA.matches.filter(m=>inLeague(m)&&hit(m)).sort((a,b)=>b.ko.localeCompare(a.ko)); document.getElementById('matches').innerHTML=ms.length?ms.map(m=>matchCard(m)).join(''):'<div class="empty">該当なし</div>'; document.getElementById('topMatchesSection').style.display=(current==='すべて'&&!q)?'block':'none'; document.getElementById('top10Section').style.display=(current==='すべて'&&!q)?'block':'none'; document.getElementById('gaSection').style.display=(current==='すべて'&&!q)?'block':'none';}
async function init(){try{const r=await fetch('data.json?v='+Date.now()); DATA=await r.json(); document.getElementById('updated').textContent='最終更新: '+DATA.updated; document.getElementById('topMatches').innerHTML=DATA.topMatches.map(m=>matchCard(m,true)).join(''); const top=[...DATA.players].sort((a,b)=>(b.rating-a.rating)||(a.rank-b.rank)).slice(0,10); document.getElementById('top10').innerHTML=top.map((p,i)=>playerCard({...p,rank:i+1})).join(''); renderGA(); render();}catch(e){document.getElementById('updated').textContent='data.json の読み込みに失敗しました'; console.error(e)}}
document.getElementById('search').addEventListener('input',render); init();
</script>
</body>
</html>
