<!doctype html>
<html lang="ja" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101214">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="stylesheet" href="app-v2.css">
<link rel="stylesheet" href="app-v2-league.css">
<title>Football Companion</title>
</head>
<body>
<div class="app-shell">
  <aside class="desktop-rail" aria-label="メインナビゲーション">
    <div class="brand-mark" aria-label="Football Companion">FC</div>
    <button class="rail-item is-active" data-page="matches" type="button"><span>⚽</span><small>試合</small></button>
    <button class="rail-item" data-page="leagues" type="button"><span>🏆</span><small>リーグ</small></button>
    <button class="rail-item" data-page="following" type="button"><span>★</span><small>フォロー中</small></button>
    <button class="rail-item" data-page="japanese" type="button"><span>🇯🇵</span><small>日本人</small></button>
    <button class="rail-item" data-page="more" type="button"><span>•••</span><small>その他</small></button>
  </aside>

  <div class="app-column">
    <header class="app-bar">
      <div>
        <div class="eyebrow" id="pageEyebrow">Football Companion</div>
        <h1 id="pageTitle">試合</h1>
      </div>
      <div class="app-actions">
        <span id="dataMode" class="data-mode">準備中</span>
        <button id="themeButton" class="icon-button" type="button" aria-label="テーマ切替">◐</button>
      </div>
    </header>

    <main id="appMain" class="app-main" aria-live="polite"></main>
  </div>

  <nav class="bottom-nav" aria-label="メインナビゲーション">
    <button class="nav-item is-active" data-page="matches" type="button"><span>⚽</span><small>試合</small></button>
    <button class="nav-item" data-page="leagues" type="button"><span>🏆</span><small>リーグ</small></button>
    <button class="nav-item" data-page="following" type="button"><span>★</span><small>フォロー中</small></button>
    <button class="nav-item" data-page="japanese" type="button"><span>🇯🇵</span><small>日本人</small></button>
    <button class="nav-item" data-page="more" type="button"><span>•••</span><small>その他</small></button>
  </nav>
</div>
<script src="formation-view.js"></script>
<script src="backfill-merge.js"></script>
<script src="v2-backfill-data.js"></script>
<script src="app-v2.js"></script>
</body>
</html>
