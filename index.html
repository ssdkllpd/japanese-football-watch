<style>

}.lead{font-size:12px;color:var(--m);margin:-4px 0 10px}.card{background:linear-gradient(var(--p),#0f1627);border:1px solid var(--l);border-radius:15px;padding:13px;margin-bottom:9px}.grid{display:grid;grid-template-columns:1fr;gap:9px}.row{display:flex;gap:10px;align-items:flex-start}.rank{min-width:32px;height:32px;border-radius:9px;background:var(--p2);display:grid;place-items:center;font-weight:900;color:var(--a)}.grow{flex:1;min-width:0}.name,.match{font-size:16px;font-weight:850}.sub{font-size:12px;color:var(--m);margin-top:4px}.pill{display:inline-block;border:1px solid var(--l);border-radius:999px;padding:3px 7px;font-size:10px;margin:6px 4px 0 0}.ok{color:var(--g)}.part{color:var(--y)}.no{color:var(--r)}.stars{color:var(--y)}.stats,.reason{font-size:12px;line-height:1.6;margin-top:8px}.badge{float:right;font-size:11px;padding:4px 7px;border:1px solid var(--l);border-radius:8px}.round{color:#c4b5fd;font-weight:700}.date{color:#93c5fd}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.sum{background:var(--p2);border:1px solid var(--l);border-radius:12px;text-align:center;padding:10px}.num{font-size:23px;font-weight:900}.metricValue{font-size:21px;font-weight:900;color:var(--a);margin-left:auto}.watchbtn{margin-top:10px;width:100%;border:1px solid var(--l);background:var(--p2);color:var(--t);border-radius:10px;padding:9px;font-size:12px;font-weight:700}.watchbtn.done{border-color:var(--g);color:var(--g);background:#163124}.watchedCard{opacity:.68}.kpi{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.kpi .card{margin:0}.kpiN{font-size:24px;font-weight:900}.empty{color:var(--m);padding:16px;text-align:center}.analysis{border-left:3px solid var(--b)}.fact{border-left:3px solid var(--a)}.footer{font-size:11px;color:var(--m);margin-top:24px;line-height:1.5}.searchGroup{margin-bottom:18px}@media(min-width:720px){.grid{grid-template-columns:1fr 1fr}.kpi{grid-template-columns:repeat(4,1fr)}}
</style></head><body><div class="wrap">
<div class="hero"><h1>海外日本人ウォッチ</h1><div class="heroMeta"><label class="seasonBox">シーズン <select id="seasonSelect" class="seasonSelect" aria-label="シーズン選択"></select></label><div id="updated" class="muted">読み込み中…</div></div></div>

<main>

<div id="v-matches" class="view"><section><h2>試合ログ</h2><div class="lead">視聴済みはこの端末のブラウザに保存。</div><div id="logWatchBtns" class="scroll"></div><div id="matchLeagueBtns" class="scroll" style="margin-top:8px"></div><div id="matches" style="margin-top:10px"></div></section></div>

</main><div class="footer">数値は確認済みデータのみ。未確認データを推測で0にしません。</div></div>
<script>
let D=null,seasonManifest={current:'2026-27',seasons:[{id:'2026-27',label:'2026-27',data:'data.json',current:true}]},selectedSeason='2026-27',page='home',lastPage='home',scope='すべて',metric='goals',attLeague='すべて',matchLeague='すべて',featuredWatch='未視聴',logWatch='すべて',suggestIndex=-1,suggestRows=[];
const $=id=>document.getElementById(id),R={updated:$('updated'),seasonSelect:$('seasonSelect'),pageNav:$('pageNav'),searchBox:$('searchBox'),suggestions:$('suggestions'),kpis:$('kpis'),homeFeatured:$('homeFeatured'),homeGA:$('homeGA'),featuredWatchBtns:$('featuredWatchBtns'),featured:$('featured'),scopeBtns:$('scopeBtns'),metricBtns:$('metricBtns'),statRank:$('statRank'),leagueBtns:$('leagueBtns'),leagueTitle:$('leagueTitle'),players:$('players'),logWatchBtns:$('logWatchBtns'),matchLeagueBtns:$('matchLeagueBtns'),matches:$('matches'),gaSummary:$('gaSummary'),ga:$('ga'),insights:$('insights'),analysis:$('analysis'),coverage:$('coverage'),searchSummary:$('searchSummary'),searchPlayers:$('searchPlayers'),searchMatches:$('searchMatches'),searchGA:$('searchGA')};
const order=['すべて','プレミアリーグ','チャンピオンシップ','ブンデスリーガ','ラ・リーガ','リーグ・アン','エールディヴィジ','ベルギー','ポルトガル','スコットランド'];
const pages=[['home','トップ'],['featured','注目試合'],['stats','個人成績'],['attention','リーグ別'],['matches','試合ログ'],['ga','G/A'],['insights','好調・分析'],['coverage','取得状況']];
const metrics={goals:'得点',assists:'アシスト',ga:'G+A',apps:'出場',starts:'先発',minutes:'出場時間',cleanSheets:'クリーンシート',saves:'セーブ',shots:'シュート',shotsOnTarget:'枠内シュート',keyPasses:'キーパス',tackles:'タックル',interceptions:'インターセプト',clearances:'クリア',yellowCards:'警告'};
const SEARCH_ALIASES={'上田綺世':['上田','うえだあやせ','ayase ueda','ueda'],'鈴木彩艶':['ザイオン','すずきざいおん','zion suzuki','suzuki'],'三笘薫':['みとま','かおるみとま','kaoru mitoma','mitoma'],'久保建英':['くぼ','たけふさくぼ','takefusa kubo','kubo'],'遠藤航':['えんどう','わたるえんどう','wataru endo','endo'],'鎌田大地':['かまだ','だいちかまだ','daichi kamada','kamada'],'前田大然':['まえだ','だいぜんまえだ','daizen maeda','maeda'],'田中碧':['たなかあお','ao tanaka','tanaka'],'石渡ネルソン':['いしわたりねるそん','nelson ishiwatari','ishiwatari'],'フェイエノールト':['feyenoord','フェイエ','フェイエノールト'],'シント＝トロイデン':['stvv','シントトロイデン','シントトロ','sint-truiden'],'アストン・ヴィラ':['villa','aston villa','ヴィラ'],'レアル・ソシエダ':['real sociedad','ソシエダ'],'クリスタル・パレス':['crystal palace','パレス'],'リヴァプール':['liverpool','リバプール'],'トッテナム':['tottenham','spurs','スパーズ'],'ブライトン':['brighton'],'バイエルン':['bayern','bayern munich','バイエルンミュンヘン']};
const E=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));const fmt=v=>v==null?'—':v;const st=x=>x==='verified'?['確認済','ok']:x==='partial'?['一部確認','part']:['未取得あり','no'];const WATCH_KEY='jfw-watched-v1',SEASON_KEY='jfw-season-v1';
function watchedSet(){try{return new Set(JSON.parse(localStorage.getItem(WATCH_KEY)||'[]'))}catch{return new Set()}}function saveWatched(s){localStorage.setItem(WATCH_KEY,JSON.stringify([...s]))}function key(m){return[m.league,m.ko,m.match].join('|')}function isWatched(m){return watchedSet().has(key(m))}function toggle(m){let s=watchedSet(),k=key(m);s.has(k)?s.delete(k):s.add(k);saveWatched(s);renderAll();if(R.searchBox.value.trim())renderSearch()}function watchFilter(m,mode){return mode==='すべて'||(mode==='視聴済み'?isWatched(m):!isWatched(m))}
function nav(){R.pageNav.innerHTML=pages.map(([k,v])=>`<button class="navbtn ${k===page?'on':''}" data-p="${k}">${v}</button>`).join('');R.pageNav.querySelectorAll('button').forEach(b=>b.onclick=()=>{R.searchBox.value='';clearSuggestions();showPage(b.dataset.p)})}function showPage(p){if(p!=='search')lastPage=p;page=p;document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));let target=$('v-'+p);if(target)target.classList.add('active');nav();if(p!=='search')location.hash=p;window.scrollTo({top:0,behavior:'smooth'})}
function btns(el,vals,cur,setter){el.innerHTML=vals.map(x=>`<button class="btn ${x===cur?'on':''}" data-x="${E(x)}">${E(x)}</button>`).join('');el.querySelectorAll('button').forEach(b=>b.onclick=()=>setter(b.dataset.x))}function leagues(){return order.filter(x=>x==='すべて'||(D.players||[]).some(p=>p.league===x)||(D.matches||[]).some(m=>m.league===x))}
function quick(p){let s=p.stats||{},a=[`出場 ${fmt(s.apps)}`,`先発 ${fmt(s.starts)}`,`G ${fmt(s.goals)}`,`A ${fmt(s.assists)}`];if(/GK|DF/.test(p.pos||''))a.push(`CS ${fmt(s.cleanSheets)}`);return a.join(' / ')}function pcard(p){let z=st(p.statsStatus),prio=p.priorityUpdate?`<span class="pill no">優先更新: ${E((p.priorityFields||[]).join(', ')||'未取得項目')}</span>`:'';return `<div class="card"><div class="row"><div class="rank">${E(p.rank??'—')}</div><div class="grow"><div class="name">${E(p.name)}</div><div class="sub">${E(p.club)} ・ ${E(p.pos)}</div><span class="pill ${z[1]}">${z[0]}</span><span class="pill">${E(p.status)}</span>${prio}<span class="pill stars">${'★'.repeat(p.rating||0)}${'☆'.repeat(Math.max(0,5-(p.rating||0)))}</span><div class="stats">${E(quick(p))}</div><div class="sub">集計: ${E(p.statsAsOf||'未取得')}</div></div></div></div>`}
function mcard(m,r=null){let z=st(m.status),done=isWatched(m),ko=m.ko||'';return `<div class="card ${done?'watchedCard':''}">${r?`<span class="badge">#${r} ${E(m.rating||'')}</span>`:''}<div class="match">${E(m.match)}</div><div class="sub"><span class="date">${E(ko.slice(0,10).replaceAll('-','/'))}</span> ・ ${E(m.league)} ・ <span class="round">${E(m.round||'節数未取得')}</span>${ko?' ・ '+E(ko.slice(11))+' JST':''}</div><span class="pill ${z[1]}">${z[0]}</span>${done?'<span class="pill ok">視聴済み</span>':'<span class="pill">未視聴</span>'}<div class="reason"><b>${E(m.players||'')}</b><br>${E(m.appearance||'')}<br>${E(m.reason||m.note||'')}<br><span class="muted">視聴: ${E(m.watch||'確認中')}</span></div><button class="watchbtn ${done?'done':''}" data-k="${E(key(m))}">${done?'✓ 視聴済み（戻す）':'視聴済みにする'}</button></div>`}
function bind(root,src){root.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{let m=src.find(x=>key(x)===b.dataset.k);if(m)toggle(m)})}
function renderHome(){let all=D.matches||[],un=(D.topMatches||[]).filter(x=>!isWatched(x)).sort((a,b)=>(a.rank||99)-(b.rank||99)),g=D.gaResults||[];R.kpis.innerHTML=`<div class="card"><div class="kpiN">${(D.players||[]).length}</div><div class="muted">追跡選手</div></div><div class="card"><div class="kpiN">${all.length}</div><div class="muted">試合ログ</div></div><div class="card"><div class="kpiN">${un.length}</div><div class="muted">未視聴注目</div></div><div class="card"><div class="kpiN">${g.length}</div><div class="muted">G/A記録</div></div>`;R.homeFeatured.innerHTML=un.slice(0,4).map((m,i)=>mcard(m,i+1)).join('')||'<div class="empty">未視聴の注目試合なし</div>';bind(R.homeFeatured,D.topMatches||[]);R.homeGA.innerHTML=[...g].sort((a,b)=>(b.ko||'').localeCompare(a.ko||'')).slice(0,4).map(gcard).join('')||'<div class="empty">記録なし</div>'}
function renderFeatured(){btns(R.featuredWatchBtns,['未視聴','視聴済み','すべて'],featuredWatch,x=>{featuredWatch=x;renderFeatured()});let rows=(D.topMatches||[]).filter(m=>watchFilter(m,featuredWatch)).sort((a,b)=>(a.rank||99)-(b.rank||99)),n=0;R.featured.innerHTML=rows.map(m=>mcard(m,isWatched(m)?null:++n)).join('')||'<div class="empty">該当なし</div>';bind(R.featured,D.topMatches||[])}
function statVal(p,k){let s=p.stats||{};if(k==='ga')return s.goals==null||s.assists==null?null:s.goals+s.assists;return s[k]??null}function eligible(p,k){if(k==='cleanSheets'&&!/GK|DF/.test(p.pos||''))return false;if(k==='saves'&&!/GK/.test(p.pos||''))return false;return true}function renderStats(){btns(R.scopeBtns,leagues(),scope,x=>{scope=x;renderStats()});R.metricBtns.innerHTML=Object.entries(metrics).map(([k,v])=>`<button class="btn ${k===metric?'on':''}" data-k="${k}">${v}</button>`).join('');R.metricBtns.querySelectorAll('button').forEach(b=>b.onclick=()=>{metric=b.dataset.k;renderStats()});let rows=(D.players||[]).filter(p=>(scope==='すべて'||p.league===scope)&&eligible(p,metric)).map(p=>[p,statVal(p,metric)]).filter(x=>x[1]!=null).sort((a,b)=>b[1]-a[1]||(b[0].rating||0)-(a[0].rating||0));R.statRank.innerHTML=rows.map(([p,v],i)=>`<div class="card"><div class="row"><div class="rank">${i+1}</div><div class="grow"><div class="name">${E(p.name)}</div><div class="sub">${E(p.club)} ・ ${E(p.league)} ・ ${E(p.statsAsOf||'')}</div></div><div class="metricValue">${E(v)}</div></div></div>`).join('')||'<div class="empty">この指標は現在取得できていません。</div>'}
function renderAttention(){btns(R.leagueBtns,leagues(),attLeague,x=>{attLeague=x;renderAttention()});let rows=(D.players||[]).filter(p=>attLeague==='すべて'||p.league===attLeague).sort((a,b)=>(a.rank||99)-(b.rank||99));R.leagueTitle.textContent=attLeague==='すべて'?'リーグ別 注目度ランキング':attLeague+' 注目度ランキング';R.players.innerHTML=rows.map(pcard).join('')||'<div class="empty">該当なし</div>'}
function renderMatches(){btns(R.logWatchBtns,['未視聴','視聴済み','すべて'],logWatch,x=>{logWatch=x;renderMatches()});btns(R.matchLeagueBtns,leagues(),matchLeague,x=>{matchLeague=x;renderMatches()});let rows=(D.matches||[]).filter(m=>(matchLeague==='すべて'||m.league===matchLeague)&&watchFilter(m,logWatch)).sort((a,b)=>(b.ko||'').localeCompare(a.ko||''));R.matches.innerHTML=rows.map(m=>mcard(m)).join('')||'<div class="empty">該当なし</div>';bind(R.matches,D.matches||[])}
function gcard(x){return `<div class="card"><div class="name">${E(x.player)} <span class="pill">${E(x.contribution)}</span></div><div class="sub">${E(x.club)} ・ ${E(x.league)}</div><div class="reason">${E(x.match)} — <b>${E(x.resultLabel)}</b></div><div class="sub">${E(x.round||'')} ・ ${E(x.ko||'')} JST</div></div>`}function renderGA(){let rows=D.gaResults||[],c={W:0,D:0,L:0};rows.forEach(x=>c[x.result]=(c[x.result]||0)+1);R.gaSummary.innerHTML=`<div class="sum"><div class="num ok">${c.W}</div><div class="muted">勝</div></div><div class="sum"><div class="num part">${c.D}</div><div class="muted">分</div></div><div class="sum"><div class="num no">${c.L}</div><div class="muted">敗</div></div>`;R.ga.innerHTML=[...rows].sort((a,b)=>(b.ko||'').localeCompare(a.ko||'')).map(gcard).join('')||'<div class="empty">記録なし</div>'}
function renderInsights(){let ins=D.insights||[],ana=(D.analysis||[]).filter(x=>x.confidence!=='low');R.insights.innerHTML=ins.map(x=>`<div class="card fact"><div class="name">${E(x.player||x.title||'注目')}</div><div class="reason"><b>確認できた事実</b><br>${E(x.fact||'')}<br><br><b>なぜ注目か</b><br>${E(x.why||'')}</div></div>`).join('');R.analysis.innerHTML=ana.map(x=>`<div class="card analysis"><div class="name">${E(x.player||x.title||'分析')} <span class="pill">確信度 ${E(x.confidence||'medium')}</span></div><div class="reason">${E(x.text||x.analysis||'')}</div></div>`).join('');if(!ins.length&&!ana.length)R.insights.innerHTML='<div class="empty">現時点で、掲載に足る根拠のある好調・分析項目はありません。</div>'}
function renderCoverage(){R.coverage.innerHTML=(D.dataCoverage||[]).map(x=>`<div class="card"><b>${E(x.label)}</b><span class="badge">${E(x.level)}</span><div class="reason">${E(x.note)}</div></div>`).join('')}
function hira(s){return s.replace(/[ァ-ヶ]/g,c=>String.fromCharCode(c.charCodeAt(0)-0x60))}function norm(s){return hira(String(s??'').normalize('NFKC').toLowerCase()).replace(/[\s・･＝=_.\-‐‑‒–—―'’"()（）/／]/g,'')}function distance(a,b){a=norm(a);b=norm(b);if(a===b)return 0;if(!a.length)return b.length;if(!b.length)return a.length;let p=Array.from({length:b.length+1},(_,i)=>i);for(let i=1;i<=a.length;i++){let n=[i];for(let j=1;j<=b.length;j++)n[j]=Math.min(n[j-1]+1,p[j]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=n}return p[b.length]}function terms(obj){let vals=[];if(obj.name)vals.push(obj.name,...(obj.aliases||[]),...(obj.reading?[obj.reading]:[]),...(obj.romanizedName?[obj.romanizedName]:[]));if(obj.club)vals.push(obj.club,...(obj.clubAliases||[]));if(obj.player)vals.push(obj.player);if(obj.match)vals.push(obj.match);if(obj.players)vals.push(obj.players);if(obj.league)vals.push(obj.league);for(let v of [...vals])if(SEARCH_ALIASES[v])vals.push(...SEARCH_ALIASES[v]);return [...new Set(vals.filter(Boolean))]}
function scoreTerm(t,q){let a=norm(t),b=norm(q);if(!a||!b)return -1;if(a===b)return 1000;if(a.startsWith(b))return 850-Math.min(100,a.length-b.length);let at=a.indexOf(b);if(at>=0)return 700-at*5;if(b.length<3)return -1;let d=distance(a,b),lim=b.length<=4?1:b.length<=8?2:3;if(d<=lim)return 500-d*70-Math.abs(a.length-b.length)*5;for(let part of String(t).split(/[\s・･＝=_.\-‐‑‒–—―'’"()（）/／]+/)){let np=norm(part),pd=distance(np,b);if(np.startsWith(b))return 800-Math.min(100,np.length-b.length);if(pd<=lim)return 430-pd*60}return -1}function fuzzyScore(obj,q){let best=-1;for(let t of terms(obj))best=Math.max(best,scoreTerm(t,q));if(best<0){let text=norm(JSON.stringify(obj));if(text.includes(norm(q)))best=350}return best}
function allSuggestions(q){let rows=[],clubs=new Set();for(let p of D.players||[]){let s=fuzzyScore(p,q);if(s>=0)rows.push({type:'選手',label:p.name,sub:p.club,score:s});if(p.club)clubs.add(p.club)}for(let c of clubs){let obj={name:c};let s=fuzzyScore(obj,q);if(s>=0)rows.push({type:'クラブ',label:c,sub:'クラブ',score:s-20})}let seen=new Set();return rows.sort((a,b)=>b.score-a.score||a.label.localeCompare(b.label,'ja')).filter(x=>{let k=x.type+'|'+x.label;if(seen.has(k))return false;seen.add(k);return true}).slice(0,6)}function clearSuggestions(){suggestRows=[];suggestIndex=-1;R.suggestions.innerHTML=''}function renderSuggestions(){let q=R.searchBox.value.trim();if(!q||!D){clearSuggestions();return}suggestRows=allSuggestions(q);suggestIndex=-1;R.suggestions.innerHTML=suggestRows.map((x,i)=>`<button class="suggestion" type="button" role="option" data-i="${i}"><span><b>${E(x.label)}</b><br><small>${E(x.sub||'')}</small></span><small>${E(x.type)}</small></button>`).join('');R.suggestions.querySelectorAll('.suggestion').forEach(b=>b.onclick=()=>chooseSuggestion(Number(b.dataset.i)))}function paintSuggestion(){R.suggestions.querySelectorAll('.suggestion').forEach((b,i)=>b.classList.toggle('on',i===suggestIndex))}function chooseSuggestion(i){let x=suggestRows[i];if(!x)return;R.searchBox.value=x.label;clearSuggestions();renderSearch();R.searchBox.focus()}
function renderSearch(){let raw=R.searchBox.value.trim();if(!raw||!D){clearSuggestions();if(D)showPage(lastPage);return}let scored=arr=>arr.map(x=>[x,fuzzyScore(x,raw)]).filter(x=>x[1]>=0).sort((a,b)=>b[1]-a[1]).map(x=>x[0]);let ps=scored(D.players||[]),ms=scored(D.matches||[]),gs=scored(D.gaResults||[]);R.searchSummary.textContent=`「${raw}」: 選手 ${ps.length}件 / 試合 ${ms.length}件 / G/A ${gs.length}件`;R.searchPlayers.innerHTML=ps.map(pcard).join('')||'<div class="empty">該当なし</div>';R.searchMatches.innerHTML=ms.map(m=>mcard(m)).join('')||'<div class="empty">該当なし</div>';bind(R.searchMatches,D.matches||[]);R.searchGA.innerHTML=gs.map(gcard).join('')||'<div class="empty">該当なし</div>';showPage('search')}
function renderAll(){nav();renderHome();renderFeatured();renderStats();renderAttention();renderMatches();renderGA();renderInsights();renderCoverage()}
function seasonById(id){return (seasonManifest.seasons||[]).find(s=>s.id===id)}function renderSeasonOptions(){R.seasonSelect.innerHTML=(seasonManifest.seasons||[]).map(s=>`<option value="${E(s.id)}">${E(s.label)}${s.id===seasonManifest.current?'（現行）':''}</option>`).join('');R.seasonSelect.value=selectedSeason}
async function fetchJson(path){let sep=path.includes('?')?'&':'?';let r=await fetch(path+sep+'v='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error(path+' '+r.status);return r.json()}
async function loadSeason(id,{persist=true}={}){let s=seasonById(id)||seasonById(seasonManifest.current)||seasonManifest.seasons[0];if(!s)throw new Error('season not found');R.updated.textContent='読み込み中…';D=await fetchJson(s.data);selectedSeason=s.id;R.seasonSelect.value=selectedSeason;if(persist)localStorage.setItem(SEASON_KEY,selectedSeason);let u=new URL(location.href);u.searchParams.set('season',selectedSeason);history.replaceState(null,'',u.pathname+u.search+u.hash);document.title=`海外日本人ウォッチ ${s.label}`;R.updated.textContent=`${s.label} ・ 最終更新: ${D.updated||'未取得'}`;scope='すべて';attLeague='すべて';matchLeague='すべて';featuredWatch='未視聴';logWatch='すべて';R.searchBox.value='';clearSuggestions();renderAll();showPage(page==='search'?lastPage:page)}
async function init(){try{try{seasonManifest=await fetchJson('seasons.json')}catch(e){console.warn('seasons.json fallback',e)}let h=location.hash.replace('#','');if(pages.some(x=>x[0]===h)){page=h;lastPage=h}let fromUrl=new URL(location.href).searchParams.get('season'),saved=localStorage.getItem(SEASON_KEY),candidate=[fromUrl,saved,seasonManifest.current].find(x=>x&&seasonById(x))||seasonManifest.seasons[0]?.id;selectedSeason=candidate;renderSeasonOptions();await loadSeason(selectedSeason,{persist:false})}catch(e){R.updated.textContent='データ読み込みエラー';console.error(e)}}
R.seasonSelect.addEventListener('change',()=>loadSeason(R.seasonSelect.value).catch(e=>{R.updated.textContent='シーズン読み込みエラー';console.error(e)}));R.searchBox.addEventListener('input',()=>{renderSuggestions();renderSearch()});R.searchBox.addEventListener('focus',renderSuggestions);R.searchBox.addEventListener('keydown',e=>{if(e.key==='ArrowDown'&&suggestRows.length){e.preventDefault();suggestIndex=(suggestIndex+1)%suggestRows.length;paintSuggestion()}else if(e.key==='ArrowUp'&&suggestRows.length){e.preventDefault();suggestIndex=(suggestIndex-1+suggestRows.length)%suggestRows.length;paintSuggestion()}else if(e.key==='Enter'&&suggestIndex>=0){e.preventDefault();chooseSuggestion(suggestIndex)}else if(e.key==='Escape'){R.searchBox.value='';clearSuggestions();showPage(lastPage)}});document.addEventListener('click',e=>{if(!e.target.closest('.searchWrap'))clearSuggestions()});init();
</script></body></html>
