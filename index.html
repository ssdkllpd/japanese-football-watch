<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1020"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg"><title>海外日本人ウォッチ 2026-27</title>
<style>
:root{--bg:#080c18;--p:#11182a;--p2:#182238;--t:#f4f7fb;--m:#95a3b8;--a:#5eead4;--b:#60a5fa;--l:#27334a;--y:#fbbf24;--r:#fca5a5;--g:#86efac}*{box-sizing:border-box}body{margin:0;background:linear-gradient(#080c18,#0d1322 55%,#080c18);color:var(--t);font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif}.wrap{max-width:960px;margin:auto;padding:18px 14px 80px}.hero h1{font-size:25px;margin:5px 0}.muted{color:var(--m);font-size:12px}.sticky{position:sticky;top:0;z-index:9;background:#080c18ee;backdrop-filter:blur(10px);padding:9px 0;border-bottom:1px solid var(--l)}.scroll{display:flex;gap:7px;overflow:auto;scrollbar-width:none}.scroll::-webkit-scrollbar{display:none}.btn{border:1px solid var(--l);background:var(--p);color:var(--t);border-radius:999px;padding:8px 11px;white-space:nowrap;font-size:12px}.btn.on{background:var(--a);color:#06211d;border-color:var(--a);font-weight:800}.search{width:100%;margin-top:9px;background:var(--p);border:1px solid var(--l);border-radius:11px;padding:11px;color:var(--t)}section{margin-top:22px}h2{font-size:18px;margin:0 0 10px}.card{background:linear-gradient(var(--p),#0f1627);border:1px solid var(--l);border-radius:15px;padding:13px;margin-bottom:9px}.grid{display:grid;grid-template-columns:1fr;gap:9px}.row{display:flex;gap:10px;align-items:flex-start}.rank{min-width:32px;height:32px;border-radius:9px;background:var(--p2);display:grid;place-items:center;font-weight:900;color:var(--a)}.grow{flex:1;min-width:0}.name,.match{font-size:16px;font-weight:850}.sub{font-size:12px;color:var(--m);margin-top:4px}.pill{display:inline-block;border:1px solid var(--l);border-radius:999px;padding:3px 7px;font-size:10px;margin:6px 4px 0 0}.ok{color:var(--g)}.part{color:var(--y)}.no{color:var(--r)}.stars{color:var(--y)}.stats{font-size:12px;margin-top:8px;line-height:1.6}.reason{font-size:13px;line-height:1.5;margin-top:7px}.badge{float:right;font-size:11px;padding:4px 7px;border:1px solid var(--l);border-radius:8px}.round{color:#c4b5fd;font-weight:700}.date{color:#93c5fd}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.sum{background:var(--p2);border:1px solid var(--l);border-radius:12px;text-align:center;padding:10px}.num{font-size:24px;font-weight:900}.metricValue{font-size:21px;font-weight:900;color:var(--a);margin-left:auto}.coverage{display:grid;gap:7px}.coverage .card{margin:0}.note{font-size:11px;color:var(--m);margin-top:7px;line-height:1.5}.footer{font-size:11px;color:var(--m);margin-top:22px}@media(min-width:720px){.grid{grid-template-columns:1fr 1fr}}
</style></head><body><div class="wrap">
<div class="hero"><h1>海外日本人ウォッチ 2026-27</h1><div id="updated" class="muted">読み込み中…</div></div>
<div class="sticky"><div id="tabs" class="scroll"></div><input id="search" class="search" placeholder="選手・クラブ・試合を検索"></div>
<section id="topS"><h2>今見るべき試合 TOP5</h2><div id="top" class="grid"></div></section>
<section id="statS"><h2>個人成績ランキング <span class="muted">（追跡対象日本人内）</span></h2><div id="scopeBtns" class="scroll"></div><div id="metricBtns" class="scroll" style="margin-top:8px"></div><div class="note">未取得値は除外。<b>0 と未取得（—）は区別</b>しています。詳細指標はリーグ横断で安定取得できないため、確認できた値だけ掲載します。</div><div id="statRank" style="margin-top:10px"></div></section>
<section id="gaS"><h2>日本人G/A試合のチーム成績</h2><div id="gaSummary" class="summary"></div><div id="ga" class="grid" style="margin-top:9px"></div></section>
<section id="attentionS"><h2 id="leagueTitle">リーグ別 注目度ランキング</h2><div id="players"></div></section>
<section><h2>直近の試合ログ</h2><div id="matches"></div></section>
<section id="coverageS"><h2>データ取得状況</h2><div id="coverage" class="coverage"></div></section>
<div class="footer">数値は確認済みデータのみ。未確認データを推測で0にしません。</div></div>
<script>
let D,league='すべて',scope='すべて',metric='goals';
const order=['すべて','プレミアリーグ','チャンピオンシップ','ブンデスリーガ','ラ・リーガ','エールディヴィジ','ベルギー','ポルトガル','スコットランド'];
const metrics={goals:'得点',assists:'アシスト',ga:'G+A',apps:'出場',starts:'先発',minutes:'出場時間',cleanSheets:'クリーンシート',saves:'セーブ',shots:'シュート',shotsOnTarget:'枠内シュート',keyPasses:'キーパス',tackles:'タックル',interceptions:'インターセプト',clearances:'クリア',yellowCards:'警告'};
const E=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
const st=x=>x==='verified'?['確認済','ok']:x==='partial'?['一部確認','part']:['未取得あり','no'];
const fmt=v=>v===undefined||v===null?'—':v;
function tabs(){let ls=[...new Set(D.players.map(x=>x.league))];tabsEl.innerHTML=order.filter(x=>x==='すべて'||ls.includes(x)).map(x=>`<button class="btn ${x===league?'on':''}" data-x="${E(x)}">${E(x)}</button>`).join('');tabsEl.querySelectorAll('button').forEach(b=>b.onclick=()=>{league=b.dataset.x;render()});scopeBtns.innerHTML=order.filter(x=>x==='すべて'||ls.includes(x)).map(x=>`<button class="btn ${x===scope?'on':''}" data-x="${E(x)}">${E(x)}</button>`).join('');scopeBtns.querySelectorAll('button').forEach(b=>b.onclick=()=>{scope=b.dataset.x;stat()});metricBtns.innerHTML=Object.entries(metrics).map(([k,v])=>`<button class="btn ${k===metric?'on':''}" data-k="${k}">${v}</button>`).join('');metricBtns.querySelectorAll('button').forEach(b=>b.onclick=()=>{metric=b.dataset.k;stat()})}
function quick(p){let s=p.stats||{};let a=[`出場 ${fmt(s.apps)}`,`先発 ${fmt(s.starts)}`,`G ${fmt(s.goals)}`,`A ${fmt(s.assists)}`];if(/GK|DF/.test(p.pos))a.push(`CS ${fmt(s.cleanSheets)}`);return a.join(' / ')}
function pcard(p){let z=st(p.statsStatus);return `<div class="card"><div class="row"><div class="rank">${E(p.rank)}</div><div class="grow"><div class="name">${E(p.name)}</div><div class="sub">${E(p.club)} ・ ${E(p.pos)}</div><span class="pill ${z[1]}">${z[0]}</span><span class="pill">${E(p.status)}</span><span class="pill stars">${'★'.repeat(p.rating)}${'☆'.repeat(5-p.rating)}</span><div class="stats">${E(quick(p))}</div><div class="sub">集計: ${E(p.statsAsOf)}</div></div></div></div>`}
function mcard(m,top=false){let z=st(m.status);return `<div class="card">${top?`<span class="badge">#${m.rank} ${E(m.rating)}</span>`:''}<div class="match">${E(m.match)}</div><div class="sub"><span class="date">${E(m.ko.slice(0,10).replaceAll('-','/'))}</span> ・ ${E(m.league)} ・ <span class="round">${E(m.round)}</span> ・ ${E(m.ko.slice(11))} JST</div><span class="pill ${z[1]}">${z[0]}</span><div class="reason"><b>${E(m.players)}</b><br>${E(m.appearance||'')}<br>${E(m.reason||m.note||'')}<br><span class="muted">視聴: ${E(m.watch||'確認中')}</span></div></div>`}
function statVal(p,k){let s=p.stats||{};if(k==='ga'){if(s.goals==null||s.assists==null)return null;return s.goals+s.assists}return s[k]??null}
function eligible(p,k){if(k==='cleanSheets'&&!/GK|DF/.test(p.pos))return false;if(k==='saves'&&!/GK/.test(p.pos))return false;return true}
function stat(){tabs();let rows=D.players.filter(p=>(scope==='すべて'||p.league===scope)&&eligible(p,metric)).map(p=>[p,statVal(p,metric)]).filter(x=>x[1]!==null).sort((a,b)=>b[1]-a[1]||b[0].rating-a[0].rating||a[0].name.localeCompare(b[0].name,'ja'));if(!rows.length){statRank.innerHTML='<div class="card muted">この指標は現在取得できていません。</div>';return}statRank.innerHTML=rows.slice(0,20).map(([p,v],i)=>`<div class="card"><div class="row"><div class="rank">${i+1}</div><div class="grow"><div class="name">${E(p.name)}</div><div class="sub">${E(p.club)} ・ ${E(p.league)} ・ ${E(p.statsAsOf)}</div></div><div class="metricValue">${E(v)}</div></div></div>`).join('')}
function ga(){let c={W:0,D:0,L:0};D.gaResults.forEach(x=>c[x.result]++);gaSummary.innerHTML=`<div class="sum"><div class="num ok">${c.W}</div><div class="muted">勝</div></div><div class="sum"><div class="num part">${c.D}</div><div class="muted">分</div></div><div class="sum"><div class="num no">${c.L}</div><div class="muted">敗</div></div>`;gaEl.innerHTML=[...D.gaResults].sort((a,b)=>b.ko.localeCompare(a.ko)).map(x=>`<div class="card"><div class="name">${E(x.player)} <span class="pill">${E(x.contribution)}</span></div><div class="sub">${E(x.club)} ・ ${E(x.league)}</div><div class="reason">${E(x.match)} — <b>${E(x.resultLabel)}</b></div><div class="sub">${E(x.round)} ・ ${E(x.ko)} JST</div></div>`).join('')}
function render(){tabs();let q=search.value.trim().toLowerCase(),f=x=>(league==='すべて'||x.league===league)&&(!q||JSON.stringify(x).toLowerCase().includes(q));let ps=D.players.filter(f).sort((a,b)=>a.rank-b.rank);players.innerHTML=ps.map(pcard).join('')||'<div class="card muted">該当なし</div>';leagueTitle.textContent=league==='すべて'?'リーグ別 注目度ランキング':'🇯🇵 '+league+' 注目度ランキング';matches.innerHTML=D.matches.filter(f).sort((a,b)=>b.ko.localeCompare(a.ko)).map(x=>mcard(x)).join('')||'<div class="card muted">該当なし</div>';let show=league==='すべて'&&!q;topS.style.display=gaS.style.display=statS.style.display=coverageS.style.display=show?'block':'none';if(show)stat()}
async function init(){let r=await fetch('data.json?v='+Date.now());D=await r.json();updated.textContent='最終更新: '+D.updated;top.innerHTML=D.topMatches.map(x=>mcard(x,true)).join('');coverage.innerHTML=D.dataCoverage.map(x=>`<div class="card"><b>${E(x.label)}</b><span class="badge">${E(x.level)}</span><div class="note">${E(x.note)}</div></div>`).join('');ga();render()}
const tabsEl=document.getElementById('tabs'),gaEl=document.getElementById('ga');search.addEventListener('input',render);init();
</script></body></html>
