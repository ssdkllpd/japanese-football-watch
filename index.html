<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1020"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg"><title>海外日本人ウォッチ 2026-27</title>
<style>
:root{--bg:#080c18;--p:#11182a;--p2:#182238;--t:#f4f7fb;--m:#95a3b8;--a:#5eead4;--b:#60a5fa;--l:#27334a;--y:#fbbf24;--r:#fca5a5;--g:#86efac}*{box-sizing:border-box}body{margin:0;background:linear-gradient(#080c18,#0d1322 55%,#080c18);color:var(--t);font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif}.wrap{max-width:980px;margin:auto;padding:14px 12px 82px}.hero h1{font-size:24px;margin:4px 0}.muted{color:var(--m);font-size:12px}.topnav{position:sticky;top:0;z-index:20;background:#080c18f4;backdrop-filter:blur(10px);padding:10px 0;border-bottom:1px solid var(--l)}.scroll{display:flex;gap:7px;overflow:auto;scrollbar-width:none}.scroll::-webkit-scrollbar{display:none}.btn,.navbtn{border:1px solid var(--l);background:var(--p);color:var(--t);border-radius:999px;padding:8px 11px;white-space:nowrap;font-size:12px}.btn.on,.navbtn.on{background:var(--a);color:#06211d;border-color:var(--a);font-weight:800}.search{width:100%;margin-top:9px;background:var(--p);border:1px solid var(--l);border-radius:11px;padding:11px;color:var(--t)}.view{display:none}.view.active{display:block}section{margin-top:20px}h2{font-size:18px;margin:0 0 10px}.lead{font-size:12px;color:var(--m);margin:-4px 0 10px}.card{background:linear-gradient(var(--p),#0f1627);border:1px solid var(--l);border-radius:15px;padding:13px;margin-bottom:9px}.grid{display:grid;grid-template-columns:1fr;gap:9px}.row{display:flex;gap:10px;align-items:flex-start}.rank{min-width:32px;height:32px;border-radius:9px;background:var(--p2);display:grid;place-items:center;font-weight:900;color:var(--a)}.grow{flex:1;min-width:0}.name,.match{font-size:16px;font-weight:850}.sub{font-size:12px;color:var(--m);margin-top:4px}.pill{display:inline-block;border:1px solid var(--l);border-radius:999px;padding:3px 7px;font-size:10px;margin:6px 4px 0 0}.ok{color:var(--g)}.part{color:var(--y)}.no{color:var(--r)}.stars{color:var(--y)}.stats,.reason{font-size:12px;line-height:1.6;margin-top:8px}.badge{float:right;font-size:11px;padding:4px 7px;border:1px solid var(--l);border-radius:8px}.round{color:#c4b5fd;font-weight:700}.date{color:#93c5fd}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.sum{background:var(--p2);border:1px solid var(--l);border-radius:12px;text-align:center;padding:10px}.num{font-size:23px;font-weight:900}.metricValue{font-size:21px;font-weight:900;color:var(--a);margin-left:auto}.watchbtn{margin-top:10px;width:100%;border:1px solid var(--l);background:var(--p2);color:var(--t);border-radius:10px;padding:9px;font-size:12px;font-weight:700}.watchbtn.done{border-color:var(--g);color:var(--g);background:#163124}.watchedCard{opacity:.68}.kpi{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.kpi .card{margin:0}.kpiN{font-size:24px;font-weight:900}.empty{color:var(--m);padding:16px;text-align:center}.analysis{border-left:3px solid var(--b)}.fact{border-left:3px solid var(--a)}.footer{font-size:11px;color:var(--m);margin-top:24px;line-height:1.5}.searchGroup{margin-bottom:18px}@media(min-width:720px){.grid{grid-template-columns:1fr 1fr}.kpi{grid-template-columns:repeat(4,1fr)}}
</style></head><body><div class="wrap">
<div class="hero"><h1>海外日本人ウォッチ 2026-27</h1><div id="updated" class="muted">読み込み中…</div></div>
<div class="topnav"><div id="pageNav" class="scroll"></div><input id="searchBox" class="search" placeholder="選手・クラブ・試合を検索" autocomplete="off"></div>
<main>
<div id="v-search" class="view"><section><h2>検索結果</h2><div id="searchSummary" class="lead"></div><div class="searchGroup"><h2>選手</h2><div id="searchPlayers" class="grid"></div></div><div class="searchGroup"><h2>試合</h2><div id="searchMatches" class="grid"></div></div><div class="searchGroup"><h2>G/A</h2><div id="searchGA" class="grid"></div></div></section></div>
<div id="v-home" class="view active"><section><h2>ダッシュボード</h2><div id="kpis" class="kpi"></div></section><section><h2>未視聴の注目試合</h2><div id="homeFeatured" class="grid"></div></section><section><h2>直近のG/A</h2><div id="homeGA" class="grid"></div></section></div>
<div id="v-featured" class="view"><section><h2>注目試合</h2><div class="lead">見る優先度。視聴済みは下へ移動します。</div><div id="featuredWatchBtns" class="scroll"></div><div id="featured" class="grid" style="margin-top:10px"></div></section></div>
<div id="v-stats" class="view"><section><h2>個人成績ランキング</h2><div class="lead">追跡対象日本人内。0と未取得（—）は区別。</div><div id="scopeBtns" class="scroll"></div><div id="metricBtns" class="scroll" style="margin-top:8px"></div><div id="statRank" style="margin-top:10px"></div></section></div>
<div id="v-attention" class="view"><section><h2 id="leagueTitle">リーグ別 注目度ランキング</h2><div id="leagueBtns" class="scroll"></div><div id="players" style="margin-top:10px"></div></section></div>
<div id="v-matches" class="view"><section><h2>試合ログ</h2><div class="lead">視聴済みはこの端末のブラウザに保存。</div><div id="logWatchBtns" class="scroll"></div><div id="matchLeagueBtns" class="scroll" style="margin-top:8px"></div><div id="matches" style="margin-top:10px"></div></section></div>
<div id="v-ga" class="view"><section><h2>日本人G/A試合のチーム成績</h2><div id="gaSummary" class="summary"></div><div id="ga" class="grid" style="margin-top:10px"></div></section></div>
<div id="v-insights" class="view"><section><h2>好調・注目ポイント</h2><div class="lead">根拠がある項目のみ表示。事実と分析を分離。</div><div id="insights"></div><div id="analysis"></div></section></div>
<div id="v-coverage" class="view"><section><h2>データ取得状況</h2><div id="coverage"></div></section></div>
</main><div class="footer">数値は確認済みデータのみ。未確認データを推測で0にしません。</div></div>
<script>
let D,page='home',lastPage='home',scope='すべて',metric='goals',attLeague='すべて',matchLeague='すべて',featuredWatch='未視聴',logWatch='すべて';
const $=id=>document.getElementById(id),R={updated:$('updated'),pageNav:$('pageNav'),searchBox:$('searchBox'),kpis:$('kpis'),homeFeatured:$('homeFeatured'),homeGA:$('homeGA'),featuredWatchBtns:$('featuredWatchBtns'),featured:$('featured'),scopeBtns:$('scopeBtns'),metricBtns:$('metricBtns'),statRank:$('statRank'),leagueBtns:$('leagueBtns'),leagueTitle:$('leagueTitle'),players:$('players'),logWatchBtns:$('logWatchBtns'),matchLeagueBtns:$('matchLeagueBtns'),matches:$('matches'),gaSummary:$('gaSummary'),ga:$('ga'),insights:$('insights'),analysis:$('analysis'),coverage:$('coverage'),searchSummary:$('searchSummary'),searchPlayers:$('searchPlayers'),searchMatches:$('searchMatches'),searchGA:$('searchGA')};
const order=['すべて','プレミアリーグ','チャンピオンシップ','ブンデスリーガ','ラ・リーガ','リーグ・アン','エールディヴィジ','ベルギー','ポルトガル','スコットランド'];
const pages=[['home','トップ'],['featured','注目試合'],['stats','個人成績'],['attention','リーグ別'],['matches','試合ログ'],['ga','G/A'],['insights','好調・分析'],['coverage','取得状況']];
const metrics={goals:'得点',assists:'アシスト',ga:'G+A',apps:'出場',starts:'先発',minutes:'出場時間',cleanSheets:'クリーンシート',saves:'セーブ',shots:'シュート',shotsOnTarget:'枠内シュート',keyPasses:'キーパス',tackles:'タックル',interceptions:'インターセプト',clearances:'クリア',yellowCards:'警告'};
const E=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));const fmt=v=>v==null?'—':v;const st=x=>x==='verified'?['確認済','ok']:x==='partial'?['一部確認','part']:['未取得あり','no'];const WATCH_KEY='jfw-watched-v1';
function watchedSet(){try{return new Set(JSON.parse(localStorage.getItem(WATCH_KEY)||'[]'))}catch{return new Set()}}function saveWatched(s){localStorage.setItem(WATCH_KEY,JSON.stringify([...s]))}function key(m){return[m.league,m.ko,m.match].join('|')}function isWatched(m){return watchedSet().has(key(m))}function toggle(m){let s=watchedSet(),k=key(m);s.has(k)?s.delete(k):s.add(k);saveWatched(s);renderAll();if(R.searchBox.value.trim())renderSearch()}function watchFilter(m,mode){return mode==='すべて'||(mode==='視聴済み'?isWatched(m):!isWatched(m))}
function nav(){R.pageNav.innerHTML=pages.map(([k,v])=>`<button class="navbtn ${k===page?'on':''}" data-p="${k}">${v}</button>`).join('');R.pageNav.querySelectorAll('button').forEach(b=>b.onclick=()=>{R.searchBox.value='';showPage(b.dataset.p)})}function showPage(p){if(p!=='search')lastPage=p;page=p;document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));let target=$('v-'+p);if(target)target.classList.add('active');nav();if(p!=='search')location.hash=p;window.scrollTo({top:0,behavior:'smooth'})}
function btns(el,vals,cur,setter){el.innerHTML=vals.map(x=>`<button class="btn ${x===cur?'on':''}" data-x="${E(x)}">${E(x)}</button>`).join('');el.querySelectorAll('button').forEach(b=>b.onclick=()=>setter(b.dataset.x))}function leagues(){return order.filter(x=>x==='すべて'||(D.players||[]).some(p=>p.league===x)||(D.matches||[]).some(m=>m.league===x))}
function quick(p){let s=p.stats||{},a=[`出場 ${fmt(s.apps)}`,`先発 ${fmt(s.starts)}`,`G ${fmt(s.goals)}`,`A ${fmt(s.assists)}`];if(/GK|DF/.test(p.pos||''))a.push(`CS ${fmt(s.cleanSheets)}`);return a.join(' / ')}function pcard(p){let z=st(p.statsStatus),prio=p.priorityUpdate?`<span class="pill no">優先更新: ${E((p.priorityFields||[]).join(', ')||'未取得項目')}</span>`:'';return `<div class="card"><div class="row"><div class="rank">${E(p.rank??'—')}</div><div class="grow"><div class="name">${E(p.name)}</div><div class="sub">${E(p.club)} ・ ${E(p.pos)}</div><span class="pill ${z[1]}">${z[0]}</span><span class="pill">${E(p.status)}</span>${prio}<span class="pill stars">${'★'.repeat(p.rating||0)}${'☆'.repeat(Math.max(0,5-(p.rating||0)))}</span><div class="stats">${E(quick(p))}</div><div class="sub">集計: ${E(p.statsAsOf||'未取得')}</div></div></div></div>`}
function mcard(m,r=null){let z=st(m.status),done=isWatched(m),ko=m.ko||'';return `<div class="card ${done?'watchedCard':''}">${r?`<span class="badge">#${r} ${E(m.rating||'')}</span>`:''}<div class="match">${E(m.match)}</div><div class="sub"><span class="date">${E(ko.slice(0,10).replaceAll('-','/'))}</span> ・ ${E(m.league)} ・ <span class="round">${E(m.round||'節数未取得')}</span>${ko?' ・ '+E(ko.slice(11))+' JST':''}</div><span class="pill ${z[1]}">${z[0]}</span>${done?'<span class="pill ok">視聴済み</span>':'<span class="pill">未視聴</span>'}<div class="reason"><b>${E(m.players||'')}</b><br>${E(m.appearance||'')}<br>${E(m.reason||m.note||'')}<br><span class="muted">視聴: ${E(m.watch||'確認中')}</span></div><button class="watchbtn ${done?'done':''}" data-k="${E(key(m))}">${done?'✓ 視聴済み（戻す）':'視聴済みにする'}</button></div>`}
function bind(root,src){root.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{let m=src.find(x=>key(x)===b.dataset.k);if(m)toggle(m)})}
function renderHome(){let all=D.matches||[],un=(D.topMatches||[]).filter(x=>!isWatched(x)).sort((a,b)=>(a.rank||99)-(b.rank||99)),g=D.gaResults||[];R.kpis.innerHTML=`<div class="card"><div class="kpiN">${(D.players||[]).length}</div><div class="muted">追跡選手</div></div><div class="card"><div class="kpiN">${all.length}</div><div class="muted">試合ログ</div></div><div class="card"><div class="kpiN">${un.length}</div><div class="muted">未視聴注目</div></div><div class="card"><div class="kpiN">${g.length}</div><div class="muted">G/A記録</div></div>`;R.homeFeatured.innerHTML=un.slice(0,4).map((m,i)=>mcard(m,i+1)).join('')||'<div class="empty">未視聴の注目試合なし</div>';bind(R.homeFeatured,D.topMatches||[]);R.homeGA.innerHTML=[...g].sort((a,b)=>(b.ko||'').localeCompare(a.ko||'')).slice(0,4).map(gcard).join('')||'<div class="empty">記録なし</div>'}
function renderFeatured(){btns(R.featuredWatchBtns,['未視聴','視聴済み','すべて'],featuredWatch,x=>{featuredWatch=x;renderFeatured()});let rows=(D.topMatches||[]).filter(m=>watchFilter(m,featuredWatch)).sort((a,b)=>(a.rank||99)-(b.rank||99)),n=0;R.featured.innerHTML=rows.map(m=>mcard(m,isWatched(m)?null:++n)).join('')||'<div class="empty">該当なし</div>';bind(R.featured,D.topMatches||[])}
function statVal(p,k){let s=p.stats||{};if(k==='ga')return s.goals==null||s.assists==null?null:s.goals+s.assists;return s[k]??null}function eligible(p,k){if(k==='cleanSheets'&&!/GK|DF/.test(p.pos||''))return false;if(k==='saves'&&!/GK/.test(p.pos||''))return false;return true}function renderStats(){btns(R.scopeBtns,leagues(),scope,x=>{scope=x;renderStats()});R.metricBtns.innerHTML=Object.entries(metrics).map(([k,v])=>`<button class="btn ${k===metric?'on':''}" data-k="${k}">${v}</button>`).join('');R.metricBtns.querySelectorAll('button').forEach(b=>b.onclick=()=>{metric=b.dataset.k;renderStats()});let rows=(D.players||[]).filter(p=>(scope==='すべて'||p.league===scope)&&eligible(p,metric)).map(p=>[p,statVal(p,metric)]).filter(x=>x[1]!=null).sort((a,b)=>b[1]-a[1]||(b[0].rating||0)-(a[0].rating||0));R.statRank.innerHTML=rows.map(([p,v],i)=>`<div class="card"><div class="row"><div class="rank">${i+1}</div><div class="grow"><div class="name">${E(p.name)}</div><div class="sub">${E(p.club)} ・ ${E(p.league)} ・ ${E(p.statsAsOf||'')}</div></div><div class="metricValue">${E(v)}</div></div></div>`).join('')||'<div class="empty">この指標は現在取得できていません。</div>'}
function renderAttention(){btns(R.leagueBtns,leagues(),attLeague,x=>{attLeague=x;renderAttention()});let rows=(D.players||[]).filter(p=>attLeague==='すべて'||p.league===attLeague).sort((a,b)=>(a.rank||99)-(b.rank||99));R.leagueTitle.textContent=attLeague==='すべて'?'リーグ別 注目度ランキング':attLeague+' 注目度ランキング';R.players.innerHTML=rows.map(pcard).join('')||'<div class="empty">該当なし</div>'}
function renderMatches(){btns(R.logWatchBtns,['未視聴','視聴済み','すべて'],logWatch,x=>{logWatch=x;renderMatches()});btns(R.matchLeagueBtns,leagues(),matchLeague,x=>{matchLeague=x;renderMatches()});let rows=(D.matches||[]).filter(m=>(matchLeague==='すべて'||m.league===matchLeague)&&watchFilter(m,logWatch)).sort((a,b)=>(b.ko||'').localeCompare(a.ko||''));R.matches.innerHTML=rows.map(m=>mcard(m)).join('')||'<div class="empty">該当なし</div>';bind(R.matches,D.matches||[])}
function gcard(x){return `<div class="card"><div class="name">${E(x.player)} <span class="pill">${E(x.contribution)}</span></div><div class="sub">${E(x.club)} ・ ${E(x.league)}</div><div class="reason">${E(x.match)} — <b>${E(x.resultLabel)}</b></div><div class="sub">${E(x.round||'')} ・ ${E(x.ko||'')} JST</div></div>`}function renderGA(){let rows=D.gaResults||[],c={W:0,D:0,L:0};rows.forEach(x=>c[x.result]=(c[x.result]||0)+1);R.gaSummary.innerHTML=`<div class="sum"><div class="num ok">${c.W}</div><div class="muted">勝</div></div><div class="sum"><div class="num part">${c.D}</div><div class="muted">分</div></div><div class="sum"><div class="num no">${c.L}</div><div class="muted">敗</div></div>`;R.ga.innerHTML=[...rows].sort((a,b)=>(b.ko||'').localeCompare(a.ko||'')).map(gcard).join('')||'<div class="empty">記録なし</div>'}
function renderInsights(){let ins=D.insights||[],ana=(D.analysis||[]).filter(x=>x.confidence!=='low');R.insights.innerHTML=ins.map(x=>`<div class="card fact"><div class="name">${E(x.player||x.title||'注目')}</div><div class="reason"><b>確認できた事実</b><br>${E(x.fact||'')}<br><br><b>なぜ注目か</b><br>${E(x.why||'')}</div></div>`).join('');R.analysis.innerHTML=ana.map(x=>`<div class="card analysis"><div class="name">${E(x.player||x.title||'分析')} <span class="pill">確信度 ${E(x.confidence||'medium')}</span></div><div class="reason">${E(x.text||x.analysis||'')}</div></div>`).join('');if(!ins.length&&!ana.length)R.insights.innerHTML='<div class="empty">現時点で、掲載に足る根拠のある好調・分析項目はありません。</div>'}
function renderCoverage(){R.coverage.innerHTML=(D.dataCoverage||[]).map(x=>`<div class="card"><b>${E(x.label)}</b><span class="badge">${E(x.level)}</span><div class="reason">${E(x.note)}</div></div>`).join('')}
function norm(s){return String(s??'').normalize('NFKC').toLowerCase()}function hasQ(obj,q){return norm(JSON.stringify(obj)).includes(q)}function renderSearch(){let raw=R.searchBox.value.trim(),q=norm(raw);if(!q){showPage(lastPage);return}let ps=(D.players||[]).filter(x=>hasQ(x,q)),ms=(D.matches||[]).filter(x=>hasQ(x,q)),gs=(D.gaResults||[]).filter(x=>hasQ(x,q));R.searchSummary.textContent=`「${raw}」: 選手 ${ps.length}件 / 試合 ${ms.length}件 / G/A ${gs.length}件`;R.searchPlayers.innerHTML=ps.map(pcard).join('')||'<div class="empty">該当なし</div>';R.searchMatches.innerHTML=ms.map(m=>mcard(m)).join('')||'<div class="empty">該当なし</div>';bind(R.searchMatches,D.matches||[]);R.searchGA.innerHTML=gs.map(gcard).join('')||'<div class="empty">該当なし</div>';showPage('search')}
function renderAll(){nav();renderHome();renderFeatured();renderStats();renderAttention();renderMatches();renderGA();renderInsights();renderCoverage()}
async function init(){try{let r=await fetch('data.json?v='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('data.json '+r.status);D=await r.json();R.updated.textContent='最終更新: '+D.updated;let h=location.hash.replace('#','');if(pages.some(x=>x[0]===h)){page=h;lastPage=h}renderAll();showPage(page)}catch(e){R.updated.textContent='データ読み込みエラー';console.error(e)}}
R.searchBox.addEventListener('input',renderSearch);R.searchBox.addEventListener('keydown',e=>{if(e.key==='Escape'){R.searchBox.value='';showPage(lastPage)}});init();
</script></body></html>
